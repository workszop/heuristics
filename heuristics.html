tkie pierwotne ograniczenia i oblicz jego wartość.","Przy minimalizacji optimum problemu po relaksacji daje oszacowanie dolne, a wartość rozwiązania dopuszczalnego daje oszacowanie górne. Przy maksymalizacji jest odwrotnie.","Porównaj różnicę. Jeśli wartości są równe, optymalność została wykazana; w przeciwnym razie podaj pozostałą różnicę."],"desc":"Umieść najlepszy możliwy wynik między udowodnioną granicą a wartością rozwiązania, które rzeczywiście spełnia wymagania.","useful":"W optymalizacji, sprawdzaniu wykonalności i decydowaniu, czy warto kontynuować poszukiwania.","watch":"Dowolne przybliżone rozwiązanie problemu po relaksacji nie jest automatycznie udowodnionym oszacowaniem granicznym. Zmiana funkcji celu wymaga osobnego uzasadnienia oszacowania.","sources":"<a href=\"#s2\">S2<\/a>, „Mathematical problem relaxation” i „Concluding Remarks”.","src":"s2"},{"n":12,"title":"Przypisz kompromisom jawny koszt","steps":["Oddziel ograniczenia nienegocjowalne od celów, w których dopuszczasz kompromisy.","Określ sposób mierzenia odstępstwa od celu i przypisz mu jawną wagę.","Porównuj kandydatów na rozwiązanie, uwzględniając pierwotną ocenę oraz ważone koszty odstępstw.","Zmieniaj wagi i obserwuj, które wybory się zmieniają.","Przedstaw kompromisy i przed wyborem sprawdź wszystkie nienegocjowalne ograniczenia."],"desc":"W roboczym modelu przypisz koszt naruszeniu negocjowalnego celu, zamiast traktować każdy cel jako bezwzględny. Pozwala to ujawnić kompromisy, a czasem podzielić zagmatwany problem na mniejsze.","useful":"Przy godzeniu preferencji dotyczących harmonogramów, wykorzystania zasobów i projektów.","watch":"Kara nie oznacza zgody na złamanie bezwzględnego wymagania. To praktyczna adaptacja modelu kar inspirowana omówieniem relaksacji Lagrange'a w źródle, nie formalny algorytm tej relaksacji. Dowolnie dobrane kary nie wyznaczają udowodnionych granic optimum.","sources":"<a href=\"#s2\">S2<\/a>, „Lagrangian Relaxation”.","src":"s2"},{"n":13,"title":"Dodawaj brakujące ograniczenia, gdy ujawnią je niepowodzenia","steps":["Rozwiąż uproszczoną wersję problemu.","Sprawdź kandydata względem pierwotnych wymagań.","Ustal przyczynę niepowodzenia i wyraź ją jako ogólne ograniczenie.","Sprawdź, czy ograniczenie zachowuje każde poprawne rozwiązanie, a następnie je dodaj.","Rozwiąż problem ponownie. Powtarzaj, aż kandydat przejdzie kontrolę lub model wykaże, że żaden kandydat nie może spełnić wymagań."],"desc":"Zacznij od modelu, z którym potrafisz pracować. Sprawdź proponowany wynik i dodaj uzasadnioną regułę wykluczającą wykryty rodzaj błędu. Powtarzaj ten proces, zamiast z góry zapisywać każde możliwe ograniczenie.","useful":"Przy złożonych modelach planowania, konfiguracji i poszukiwaniach z wieloma ograniczeniami.","watch":"Nie wykluczaj odpowiedzi tylko dlatego, że jest nietypowa. Poprawne ograniczenie musi wynikać z pierwotnego problemu, nie z twoich preferencji.","sources":"<a href=\"#s2\">S2<\/a>, „Cutting Plane Methods”. To schemat do samodzielnego zastosowania, na którym opiera się formalna metoda.","src":"s2"},{"n":14,"title":"Podejmuj decyzje etapami, pozostawiając późniejsze wybory otwarte","steps":["Podziel decyzje na etapy lub logiczne bloki.","Zachowaj wcześniejsze decyzje jako ustalone, w bieżącym bloku wymagaj poprawnych wyborów dyskretnych, a późniejsze bloki uprość.","Rozwiąż bieżący podproblem i sprawdź, czy nadal pozostaje miejsce na późniejszą pracę.","Ustal decyzje z bieżącego bloku i przejdź do następnego.","Jeśli późniejszy blok okaże się niewykonalny, wróć do wcześniejszych decyzji, zamiast uznawać cały plan za działający."],"desc":"Podziel długi ciąg decyzji na bloki. Rozstrzygaj jeden blok, korzystając z uproszczonego modelu tego, co nastąpi później.","useful":"Przy wieloetapowych harmonogramach i planach zbyt dużych, by rozstrzygnąć je w całości naraz.","watch":"Wczesne wybory mogą zablokować późniejsze etapy. To heurystyka, nie gwarancja wykonalności ani optymalności.","sources":"<a href=\"#s2\">S2<\/a>, „Relax-and-Fix Heuristics”.","src":"s2"},{"n":15,"title":"Przeplataj ogólny plan ze sprawdzaniem szczegółów","steps":["Oddziel ogólne wybory od szczegółowej pracy, która z nich wynika.","Zaproponuj ogólny plan.","Opracuj szczegóły przy tych założeniach, sprawdzając wykonalność i koszt.","Jeśli szczegóły nie dają się zrealizować, wskaż odpowiedzialną za to kombinację ogólnych decyzji. Uwzględnij wykryte ograniczenie lub informację o koszcie w poprawionym planie.","Powtarzaj, aż oba poziomy będą zgodne, a następnie sprawdź całe rozwiązanie."],"desc":"Wybierz ogólny plan, sprawdź, czy da się zrealizować jego szczegóły, i popraw go na podstawie konkretnych informacji zwrotnych.","useful":"Przy wyborze lokalizacji, planowaniu obsady, projektowaniu systemów i innych decyzjach mających poziom strategiczny oraz operacyjny.","watch":"Informacja zwrotna musi być uzasadniona i wystarczająco konkretna, aby poprawić kolejną propozycję. Ta adaptacja do samodzielnej pracy nie daje matematycznych gwarancji formalnych algorytmów dekompozycji.","sources":"<a href=\"#s2\">S2<\/a>, „Benders Decomposition”.","src":"s2"},{"n":16,"title":"Najpierw rozwiąż mały lub prosty przypadek","steps":["Zastąp duże liczby, wiele obiektów lub kilka wymiarów przypadkiem, z którym łatwiej pracować.","Rozwiąż go w całości i zapisz ważne kroki.","Wypróbuj przypadek nieco większy lub mniej wygodny.","Wskaż, co pozostało takie samo, i zaproponuj metodę do ponownego użycia.","Wróć do pierwotnego rozmiaru i sprawdź, dlaczego metoda nadal działa."],"desc":"Zmniejsz rozmiar lub złożoność problemu, zachowując zależność, którą chcesz zrozumieć.","useful":"Przy nieznanych regułach, zliczaniu, nauce, prototypach i szukaniu pierwszego punktu zaczepienia.","watch":"Zmniejszenie przykładu nie musi być formalną relaksacją problemu optymalizacyjnego. Sukces w szczególnym przypadku jest wskazówką, nie dowodem ogólnego twierdzenia.","sources":"<a href=\"#s2\">S2<\/a>, „Problem Relaxation in K-12 Math Problem-Solving”, praktyczne strategie do pracy w klasie; <a href=\"#s3\">S3<\/a>, część 5.","src":"s2"},{"n":17,"title":"Doprecyzuj problem i zakwestionuj ukryte założenia","steps":["Sformułuj pytanie własnymi słowami i opisz, co będzie oznaczało sukces.","Wypisz niewiadome, podane fakty i ograniczenia.","Zapisz założenia oddzielnie od faktów. Zapytaj, które ograniczenia są rzeczywiste, a które wynikają z przyzwyczajeń lub konwencji.","Sprawdź, czy informacje są wystarczające, sprzeczne lub nieistotne.","Wybierz pierwszy plan, realizuj go z bieżącą kontrolą, a następnie oceń zarówno odpowiedź, jak i metodę."],"desc":"Zamień niejasną trudność w pytanie z wyraźnym celem, znanymi danymi i jawnymi warunkami.","useful":"Przy niemal każdym problemie, szczególnie gdy nie ma zgody co do tego, co właściwie trzeba rozwiązać.","watch":"Rozwiązanie precyzyjnie postawionego pytania jest bezużyteczne, jeśli pytanie było niewłaściwe. Sprawdź, czy przyjęte sformułowanie nadal służy pierwotnemu celowi.","sources":"<a href=\"#s3\">S3<\/a>, części 3, 5 i 6; <a href=\"#s2\">S2<\/a>, cztery etapy rozwiązywania problemów; <a href=\"#s5\">S5<\/a>, s. 220-223, w tym potrzeba powrotów do wcześniejszych etapów.","src":"s3"},{"n":18,"title":"Zmień sposób przedstawienia problemu","steps":["Ustal, co trudno dostrzec w obecnym przedstawieniu.","Wybierz formę, która to uwidoczni, na przykład rysunek dla relacji przestrzennych lub tabelę dla przypadków.","Oznacz każdą ważną wielkość i przenieś wszystkie ograniczenia.","Rozwiąż lub zbadaj problem w nowej postaci.","Przełóż wynik z powrotem na pierwotną postać i sprawdź, czy niczego nie pominięto ani nie dodano."],"desc":"Przedstaw ten sam problem w formie, w której łatwiej dostrzec zależności: jako rysunek, tabelę, równanie, model fizyczny lub inny zestaw zmiennych.","useful":"Przy zawiłych zadaniach tekstowych, niewygodnych wyrażeniach algebraicznych, relacjach przestrzennych i splątanych zależnościach.","watch":"Przekształcenie równoważne zachowuje problem. Przybliżenie go zmienia i wymaga osobnej kontroli; szkic nie dowodzi dokładnej zależności.","sources":"<a href=\"#s3\">S3<\/a>, część 5, „Substitution or transformation” i „Abstraction”; <a href=\"#s2\">S2<\/a>, modele z użyciem konkretnych przedmiotów.","src":"s3"},{"n":19,"title":"Sprawdź jednostki i przypadki graniczne","steps":["Dopisz jednostki do wszystkich mierzonych wielkości i sprawdź ich zgodność po obu stronach każdego równania.","Sprawdź proste dane wejściowe, takie jak zero, jeden, równe wielkości lub przypadek pusty, jeśli są dopuszczalne.","Zbadaj, co dzieje się w pobliżu dozwolonego minimum lub maksimum albo gdy wielkość staje się bardzo duża.","Porównaj to zachowanie z wymaganiami pierwotnej sytuacji.","Wyjaśnij każdą rozbieżność, w tym możliwość, że przy danej granicy model przestaje obowiązywać."],"desc":"Sprawdź, czy wynik opisuje właściwy rodzaj wielkości i czy zachowuje się sensownie w prostych sytuacjach granicznych.","useful":"Przy wzorach, oszacowaniach, modelach i wykrywaniu błędów przed szczegółowymi obliczeniami.","watch":"Przejście tych kontroli nie dowodzi poprawności. Nie oczekuj sensownego zachowania poza określonym zakresem stosowalności modelu.","sources":"<a href=\"#s3\">S3<\/a>, część 5, „Dimensional analysis” i „Limiting cases”.","src":"s3"},{"n":20,"title":"Wykorzystaj symetrię, aby nie powtarzać pracy","steps":["Znajdź przekształcenia, które zachowują wszystkie reguły i cel.","Pogrupuj przypadki równoważne względem tych przekształceń.","Rozwiąż jeden przypadek reprezentujący każdą grupę.","Przenieś wynik na przypadki równoważne.","Jeśli zliczasz, starannie uwzględnij rozmiary grup; niektóre konfiguracje mają więcej symetrii niż inne."],"desc":"Jeśli zamiana, obrót, odbicie lub zmiana oznaczeń części nie zmienia problemu, pracuj na jednym przedstawicielu każdego rzeczywiście odmiennego przypadku.","useful":"W geometrii, zliczaniu, układaniu obiektów i optymalizacji z wymiennymi elementami.","watch":"Problem symetryczny nie musi mieć wyłącznie symetrycznych rozwiązań. Ograniczenia różnicujące elementy mogą zniszczyć pozorną symetrię.","sources":"<a href=\"#s3\">S3<\/a>, część 5, „Symmetry reduction”.","src":"s3"},{"n":21,"title":"Porównuj wybory przez ich skutki i kompromisy","steps":["Wypisz wykonalne opcje, w razie potrzeby uwzględniając także brak działania.","Rozrysuj ważne możliwe skutki każdej opcji.","Zapisz korzyści, koszty, porzucone alternatywy i oszacowania prawdopodobieństw, które potrafisz uzasadnić.","Porównaj skutki według spójnych kryteriów. Jeśli wartości liczbowe i prawdopodobieństwa mają sens, oblicz sumy ważone prawdopodobieństwami.","Przed decyzją zmieniaj niepewne założenia i sprawdzaj niekorzystne scenariusze."],"desc":"Jasno opisz możliwe wybory, w tym to, z czego rezygnujesz przy każdym z nich. Oddziel własne decyzje od zdarzeń, na które nie masz wpływu.","useful":"Przy decyzjach obarczonych niepewnością, konkurujących celach lub kilku rozsądnych możliwościach.","watch":"Korzystna średnia może ukrywać niedopuszczalną stratę. Nie wymyślaj prawdopodobieństw ani nie ukrywaj ocen wartościujących w jednym wskaźniku.","sources":"<a href=\"#s3\">S3<\/a>, części 7.3 i 9.","src":"s3"},{"n":22,"title":"Rozrysuj zależności i motywacje uczestników","steps":["Narysuj ważne elementy lub uczestników jako węzły.","Połącz je zależnościami, przepływami lub oddziaływaniami i zaznacz ich kierunek.","Poszukaj wąskich gardeł, pętli sprzężenia zwrotnego i konkurujących celów.","Przewidź wpływ proponowanej zmiany na resztę systemu i możliwe reakcje pozostałych uczestników.","Przetestuj zmianę w ograniczonym zakresie i oceń wynik całego systemu, nie tylko ulepszonej części."],"desc":"Spójrz szerzej niż na pojedyncze części. Przyczyną problemu mogą być zależności, ograniczony przepływ, sprzężenia zwrotne lub reakcje ludzi na wzajemne bodźce.","useful":"W problemach organizacyjnych, przy wąskich gardłach procesów, koordynacji i zmianach wywołujących skutki uboczne.","watch":"Schemat sieci jest modelem, a nie dowodem istnienia związku przyczynowego. Nie zakładaj, że ludzie mają te same informacje lub zachowują się dokładnie tak, jak przewiduje model.","sources":"<a href=\"#s3\">S3<\/a>, części 8.1 i 8.4. Procedura jest praktyczną adaptacją tych podejść.","src":"s3"},{"n":23,"title":"Eksperymentuj, znajdź wzorzec i go wyjaśnij","steps":["Przygotuj kilka małych przykładów i zapisz je w spójnej tabeli lub na rysunku.","Poszukaj powtórzeń, różnic, ilorazów lub innych stałych zależności.","Sformułuj przypuszczalną regułę precyzyjnie, określając także przewidywany zakres jej obowiązywania.","Celowo sprawdzaj niewygodne przypadki, zamiast wybierać tylko przykłady, które prawdopodobnie pasują.","Jeśli reguła się utrzymuje, wyjaśnij ją lub udowodnij na podstawie struktury problemu. Jeśli zawodzi, wykorzystaj niepowodzenie do jej poprawienia."],"desc":"Na podstawie przykładów odkryj możliwą regułę, a następnie poszukaj powodu, dla którego miałaby obowiązywać.","useful":"Przy ciągach, powtarzających się procesach, zliczaniu i badaniu nieznanych systemów.","watch":"Do tych samych początkowych przykładów może pasować wiele różnych reguł. Potwierdzenie w przykładach i ogólny dowód to dwie różne rzeczy.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 2.2, zwłaszcza s. 26-33, oraz podrozdział 6.1, s. 195; <a href=\"#s3\">S3<\/a>, części 4 i 6.","src":"s4"},{"n":24,"title":"Sprawdź zaprzeczenie i poszukaj kontrprzykładu","steps":["Zapisz oddzielnie założenia i dokładny wniosek.","Starannie zaprzecz wnioskowi. Na przykład zaprzeczeniem „każdy przypadek działa” jest „co najmniej jeden przypadek nie działa”.","Zbadaj tę możliwość, zachowując pierwotne założenia.","Jeśli prowadzi do rzeczywistej sprzeczności, wyjaśnij, dlaczego zaprzeczenie wniosku jest niemożliwe.","Jeśli zamiast tego znajdziesz poprawny kontrprzykład, odrzuć pierwotne twierdzenie lub zawęź jego zakres."],"desc":"Gdy trudno wykazać twierdzenie wprost, zapytaj, co by było, gdyby było fałszywe. Możesz też spróbować skonstruować przypadek spełniający założenia, ale przeczący wnioskowi.","useful":"Przy dowodzeniu, sprawdzaniu twierdzeń ogólnych i ujawnianiu błędnych reguł.","watch":"Brak znalezionego kontrprzykładu nie jest dowodem. W problemach empirycznych sprzeczność może wskazywać na błędny model lub założenie, a nie rozstrzygać o ogólnej prawdzie.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 2.3, s. 41-44.","src":"s4"},{"n":25,"title":"Skup się na elemencie skrajnym","steps":["Wybierz porządek lub wielkość do minimalizacji bądź maksymalizacji.","Sprawdź, czy obiekt skrajny rzeczywiście istnieje.","Wybierz go i zapisz, co wyklucza jego skrajna pozycja.","Zapytaj, czy proponowana konfiguracja wymuszałaby istnienie jeszcze mniejszego lub większego obiektu, przecząc temu wyborowi.","Wykorzystaj otrzymane ograniczenie do rozwiązania lub uproszczenia problemu."],"desc":"Wybierz obiekt najmniejszy, największy, pierwszy, ostatni lub najbardziej ograniczony. Jego skrajna pozycja dostarcza informacji niedostępnych dla dowolnego obiektu.","useful":"Przy dowodach istnienia, układaniu obiektów, uporządkowanych danych i upraszczaniu złożonych przypadków.","watch":"Zbiór nieskończony nie musi mieć minimum ani maksimum. W tym schemacie wybierasz rzeczywisty obiekt skrajny; to co innego niż sprawdzanie wzoru przy wartości granicznej.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 3.2, s. 73-83.","src":"s4"},{"n":26,"title":"Wykaż, że pewne obiekty muszą trafić do tej samej szufladki","steps":["Ustal, które obiekty przyporządkujesz do kategorii.","Zdefiniuj kategorie tak, aby przynależność do tej samej kategorii dawała użyteczną zależność.","Przypisz każdy obiekt do dokładnie jednej kategorii, jednoznacznie rozstrzygając przypadki brzegowe.","Porównaj liczbę obiektów z liczbą lub pojemnością kategorii. Więcej niż <code>k × m<\/code> obiektów w <code>m<\/code> kategoriach oznacza, że jakaś kategoria zawiera co najmniej <code>k + 1<\/code> obiektów.","Przełóż wspólną przynależność do kategorii na potrzebny wniosek."],"desc":"Jeśli obiektów jest więcej niż dostępnych kategorii, co najmniej jedna kategoria musi zawierać więcej niż jeden obiekt. To zasada szufladkowa.","useful":"Przy dowodzeniu nieuniknionych powtórzeń, kolizji, istnienia bliskich par i ograniczeń pojemności.","watch":"Trudność polega na wyborze użytecznych kategorii. Zasada gwarantuje istnienie kategorii współdzielonej przez obiekty, ale nie musi wskazywać, która to kategoria.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 3.3, s. 84-91.","src":"s4"},{"n":27,"title":"Znajdź coś, co nie może się zmienić","steps":["Dokładnie zdefiniuj dozwolone ruchy.","Sprawdź kandydatów na niezmienniki, takich jak suma, różnica, parzystość, reszta z dzielenia lub bilans kolorów.","Udowodnij, że każdy rodzaj ruchu zachowuje wybraną własność.","Porównaj jej wartość na początku i w pożądanym stanie końcowym.","Jeśli wartości się różnią, cel jest nieosiągalny przy tych ruchach. Jeśli są zgodne, kontynuuj poszukiwania, używając niezmiennika do kontroli."],"desc":"Poszukaj wielkości lub własności zachowywanej przez każdy dozwolony ruch. To niezmiennik.","useful":"W zagadkach z przekształceniami, badaniu osiągalności, rozliczeniach i sprawdzaniu powtarzanych operacji.","watch":"Zgodność niezmiennika nie dowodzi osiągalności. Musisz sprawdzić każdy dozwolony ruch, nie tylko te występujące w pierwszych przykładach.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 3.4, s. 92-102; przykład z kolorowaniem w podrozdziale 2.4, s. 54-55.","src":"s4"},{"n":28,"title":"Śledź wielkość, która zmienia się tylko w jednym kierunku","steps":["Zdefiniuj liczbową miarę bieżącego stanu.","Sprawdź, jak zmienia ją każdy dozwolony ruch.","Ustal kierunek zmian i ewentualne ograniczenie dolne lub górne.","Aby udowodnić zatrzymanie, wykaż, że zmiany nie mogą trwać w nieskończoność, na przykład dlatego, że nieujemna liczba całkowita maleje o co najmniej jeden przy każdym aktywnym kroku.","Wskaż stany, w których postęp się zatrzymuje, i sprawdź, czy spełniają pożądany wniosek."],"desc":"Znajdź miarę, która nigdy nie rośnie albo nigdy nie maleje. To monowariant; może ujawnić postęp, wykluczyć cel lub pomóc udowodnić, że proces się zatrzyma.","useful":"Przy powtarzanych procedurach, grach, stopniowym ulepszaniu i dowodzeniu zakończenia procesu.","watch":"Wartość rzeczywista może maleć bez końca. Sama ograniczoność i monotoniczność oceny nie dowodzą zakończenia w skończonej liczbie kroków, a ruchy niezmieniające oceny nadal mogą tworzyć cykle.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 3.4, „Monovariants”, s. 102-106.","src":"s4"},{"n":29,"title":"Zbuduj duży przypadek z mniejszych","steps":["Dokładnie zdefiniuj wynik lub twierdzenie dla rozmiaru <code>n<\/code>.","Rozwiąż wszystkie potrzebne przypadki początkowe.","Wyjaśnij, jak większy przypadek sprowadza się do mniejszych lub jak poprawność mniejszych przypadków pozwala wykazać następny.","Przy zliczaniu upewnij się, że konstrukcja obejmuje każdy przypadek bez powtórzeń. W dowodzie uzasadnij krok dla dowolnego dopuszczalnego rozmiaru.","Połącz przypadki początkowe z krokiem przejścia; sprawdź, czy żaden rozmiar nie został pominięty."],"desc":"Zastąp problem dotyczący całości regułą łączącą jeden rozmiar z wcześniejszymi. Użyj rekurencji do obliczania wyników lub indukcji do dowodzenia twierdzenia dla wszystkich rozmiarów.","useful":"Przy zliczaniu, ciągach, procedurach rekurencyjnych i dowodach indeksowanych liczbami całkowitymi.","watch":"Założenie poprawności właśnie tego przypadku, którego próbujesz dowieść, jest błędnym kołem. Sam krok indukcyjny bez wymaganych przypadków początkowych niczego nie ustanawia.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 2.3, s. 45-50, i podrozdział 6.4, s. 214-217.","src":"s4"},{"n":30,"title":"Rozpatrz lub policz dopełnienie","steps":["Zdefiniuj pełny zbiór dopuszczalnych możliwości.","Dokładnie określ, które możliwości nie spełniają pożądanego warunku.","Sprawdź, czy sukces i niepowodzenie są rozłączne i razem obejmują cały zbiór.","Policz całość i odejmij niepowodzenia albo użyj <code>P(sukces) = 1 - P(niepowodzenie)<\/code> z poprawnym modelem prawdopodobieństwa.","Sprawdź przypadki brzegowe i to, czy któregokolwiek niepowodzenia nie policzono więcej niż raz."],"desc":"Gdy pożądane przypadki są skomplikowane, opisz przypadki niepożądane i usuń je z całości.","useful":"Przy zliczaniu, prawdopodobieństwie i warunkach typu „co najmniej jeden” lub „nie wszystkie”.","watch":"Wyznaczanie prawdopodobieństwa przez dzielenie liczebności wymaga jednakowo prawdopodobnych wyników elementarnych. Nie można po prostu dodawać nakładających się kategorii niepowodzeń.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 6.3, s. 207-208.","src":"s4"},{"n":31,"title":"Policz to samo na dwa sposoby","steps":["Dokładnie określ, co liczysz i czy kolejność ma znaczenie.","Policz obiekty według jednego podziału lub punktu widzenia.","Policz je niezależnie z innej perspektywy albo skonstruuj odwracalne przyporządkowanie do łatwiejszych obiektów.","Sprawdź, czy obie drogi obejmują każdy poprawny obiekt tyle samo razy.","Przyrównaj sumy lub skorzystaj z łatwiejszego zliczania. Wyjaśnij każdą rozbieżność."],"desc":"Dwa różne sposoby zliczania tych samych obiektów muszą dać tę samą sumę. Wzajemnie jednoznaczne przyporządkowanie może również zastąpić trudne zliczanie łatwiejszym.","useful":"Przy tożsamościach kombinatorycznych, audytach, sprawdzaniu spójności i zapisywaniu układów obiektów w prostszej postaci.","watch":"Nadmiarowe wybory prowadzą do wielokrotnego liczenia. Gdy wcześniejsze wybory jednoznacznie wyznaczają późniejszy, nie jest on już niezależnym wyborem.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 6.1, s. 191-192, i podrozdział 6.2, zwłaszcza s. 199-200.","src":"s4"},{"n":32,"title":"Dodaj pomocniczy obiekt lub wielkość pośrednią","steps":["Zapytaj, jaka zależność ułatwiłaby ostatni krok.","Wprowadź obiekt lub wielkość, które mają ujawnić tę zależność.","Zdefiniuj je precyzyjnie i sprawdź, czy istnieją w dopuszczalnych warunkach.","Wykorzystaj je do sformułowania mniejszych twierdzeń łączących dane z celem.","Przełóż wniosek na pierwotny problem, tak aby końcowa odpowiedź nie zależała od nieuzasadnionej konstrukcji."],"desc":"Wprowadź coś, czego nie żąda wprost zadanie, na przykład prostą, zmienną, sumę częściową lub cel pośredni, aby połączyć znane fakty z pożądanym wynikiem.","useful":"W geometrii, przy niewygodnych wyrażeniach i problemach, w których dane wydają się niezwiązane z celem.","watch":"Konstrukcja, która wygląda użytecznie, może być niemożliwa albo przemycać pożądany wniosek. Dodawanie elementów bez konkretnego celu rzadko pomaga.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 8.4, s. 282-284; <a href=\"#s3\">S3<\/a>, część 5, zmienne i konstrukcje pomocnicze.","src":"s4"},{"n":33,"title":"Systematycznie wypisuj przypadki i eliminuj niemożliwe","steps":["Określ możliwe wybory lub stany i spójny sposób ich zapisu.","Podziel poszukiwania na przypadki obejmujące wszystkie możliwości bez powtórzeń.","Najpierw zastosuj kontrole najsilniej ograniczające wybór lub najtańsze w wykonaniu i skreśl przypadki, które ich nie spełniają.","W każdym pozostałym przypadku przejdź do następnego nierozstrzygniętego wyboru. Zachowuj uzasadnienia wykluczeń.","Sprawdź każdą pozostałą odpowiedź względem wszystkich warunków. Jeśli twierdzisz, że innych nie ma, wyjaśnij, dlaczego przeszukiwanie było kompletne."],"desc":"Uporządkuj poszukiwania o rozsądnym rozmiarze w tabelę lub rozgałęzioną listę. Wykorzystuj każdy warunek do usuwania przypadków, zamiast wielokrotnie zgadywać.","useful":"W zagadkach logicznych, niewielkich zbiorach konfiguracji, problemach porządkowania i poszukiwaniu wszystkich rozwiązań.","watch":"Lista może nadmiernie się rozrosnąć. Jeśli ograniczysz poszukiwania, zaznacz, że pozostali niezbadani kandydaci; brak odpowiedzi w częściowym przeszukiwaniu nie jest dowodem niemożliwości.","sources":"<a href=\"#s5\">S5<\/a>, s. 285-286, pełne wyliczenie tras, oraz s. 331-332, problem samochodów różnych kolorów; <a href=\"#s3\">S3<\/a>, część 6, uporządkowane wypisywanie i eliminacja.","src":"s5"},{"n":34,"title":"Ustal tylko tę wielkość, o którą pyta zadanie","steps":["Podkreśl dokładnie tę wielkość, której dotyczy pytanie.","Zapytaj, czy obecny plan nie prowadzi do wyznaczania dodatkowych, niepotrzebnych informacji.","Połącz znane zależności tak, aby bezpośrednio wyznaczyć szukaną wielkość.","Poszukaj redukujących się składników, par, stałych sum lub informacji wystarczających do wykluczenia każdej innej odpowiedzi.","Sprawdź, czy szukana wielkość jest jednoznacznie ustalona, nawet jeśli niektóre pojedyncze wartości pozostają nieznane."],"desc":"Czasem można wyznaczyć sumę, różnicę, iloraz lub pozycję bez poznawania każdej pojedynczej wartości.","useful":"Przy problemach pozornie niedookreślonych, długich obliczeniach i pytaniach o wielkości łączne.","watch":"Ustalona suma nie wyznacza jej poszczególnych składników. Jeśli kilka dopuszczalnych konfiguracji daje różne wartości szukanej wielkości, informacji rzeczywiście jest za mało.","sources":"<a href=\"#s5\">S5<\/a>, s. 322-323, sumowanie kątów bez wyznaczania każdego z osobna, oraz s. 332, ustalenie pierwszego samochodu bez odtwarzania całej kolejności; <a href=\"#s4\">S4<\/a>, podrozdział 3.4, przykład turnieju na s. 102.","src":"s5"},{"n":35,"title":"Zacznij od wyborów zachłannych","steps":["Zdefiniuj lokalną regułę, na przykład wybieranie najbliższego nieodwiedzonego przystanku.","W każdym kroku wybierz najlepszą dostępną opcję według tej reguły, nie naruszając od razu żadnego bezwzględnego ograniczenia.","Kontynuuj, aż otrzymasz kompletnego kandydata lub nie będzie można iść dalej.","Sprawdź cały wynik, w tym wymagania takie jak powrót do punktu wyjścia.","Zanim go zaakceptujesz, porównaj go z innym wyborem początkowym, lokalnym ulepszeniem lub oszacowaniem granicznym."],"desc":"Buduj kandydata na rozwiązanie, za każdym razem wybierając najbardziej atrakcyjny następny krok według prostej reguły.","useful":"Gdy trzeba szybko przygotować pierwszą trasę, kolejność lub podział zasobów, a pełne przeszukiwanie jest zbyt kosztowne.","watch":"Najlepszy następny ruch może wymusić kosztowny ruch później albo prowadzić do ślepego zaułka. Uznanie wyniku metody zachłannej za optymalny wymaga osobnego dowodu.","sources":"<a href=\"#s5\">S5<\/a>, s. 285-286. W przykładzie z czterema miastami metoda najbliższego sąsiada daje trasę 635 km, podczas gdy pełne porównanie pozwala znaleźć trasę 625 km.","src":"s5"},{"n":36,"title":"Sprawdzaj postęp i świadomie zmieniaj plan","steps":["Określ, co ma ustalić bieżąca próba.","W odpowiednim momencie kontroli zapytaj: „Czego dowiaduję się z tej próby? Co pozostaje nieznane? Dlaczego następny krok miałby pomóc?”.","Oddziel brak wiedzy od źle dobranej strategii lub błędnego odczytania problemu.","Kontynuuj, jeśli próba przynosi wiedzę lub postęp; w przeciwnym razie wróć do odpowiedniego wcześniejszego etapu, uzupełnij wiedzę albo wybierz inny schemat.","Na końcu zweryfikuj odpowiedź i zapisz wniosek do ponownego wykorzystania, błędne założenie oraz sytuacje, w których metoda znów mogłaby się przydać."],"desc":"Kontroluj rozumowanie podczas pracy, nie dopiero po uzyskaniu odpowiedzi. Samo zajęcie czymś czasu nie oznacza postępu.","useful":"Przy długich analizach, powtarzających się niepowodzeniach, nauce i każdym problemie bez oczywistej metody.","watch":"Nie zmieniaj metody przy każdej trudności, ale też nie trzymaj się planu tylko dlatego, że poświęcono mu już czas. Te schematy nie zastąpią niezbędnej wiedzy z danej dziedziny.","sources":"<a href=\"#s5\">S5<\/a>, s. 27-28, 48-50 i 220-226, o samokontroli, cyklicznym rozwiązywaniu problemów oraz wzajemnym wpływie wiedzy, strategii, kontroli i przekonań.","src":"s5"},{"n":37,"title":"Uogólnij, aby ujawnić strukturę","steps":["Wskaż ustalony szczegół, który może ukrywać strukturę.","Zastąp go parametrem i określ dopuszczalne wartości.","Porównaj kilka przypadków z nowej rodziny, w tym przypadek pierwotny.","Poszukaj zależności lub argumentu obowiązującego w całej rodzinie i wskaż wyjątki.","Uzasadnij tę zależność, a następnie podstaw pierwotną wartość, aby odpowiedzieć na pierwotne pytanie."],"desc":"Zastąp konkretną liczbę lub obiekt zmienną i zbadaj rodzinę powiązanych problemów. Ogólniejsze twierdzenie może ujawnić zależność ukrytą przez szczegóły pierwotnego zadania.","useful":"Przy niewyjaśnionych wzorcach liczbowych, wzorach do wielokrotnego użycia i problemach ze stałymi, które wyglądają na przypadkowo dobrane.","watch":"Szersze twierdzenie może być trudniejsze lub fałszywe. Jeśli uogólnienie zwiększa zamieszanie, wróć do prostszego przypadku i zachowaj wszelkie częściowe wnioski.","sources":"<a href=\"#s4\">S4<\/a>, podrozdział 2.2, przykład 2.2.2, s. 28, zastąpienie stałej parametrem; <a href=\"#s3\">S3<\/a>, część 3, abstrakcja i uogólnianie.","src":"s4"}],"combine":[{"label":"Zaplanuj niewielkie warsztaty","html":"Określ sukces i ograniczenia <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, rozumuj wstecz od wydarzenia <span class=\"refwrap\">(<a href=\"#scheme-1\" class=\"ref\" data-ref=\"1\">1<\/a>)<\/span>, podziel przygotowania na zadania <span class=\"refwrap\">(<a href=\"#scheme-3\" class=\"ref\" data-ref=\"3\">3<\/a>)<\/span> i szacuj na podstawie podobnej pracy <span class=\"refwrap\">(<a href=\"#scheme-7\" class=\"ref\" data-ref=\"7\">7<\/a>)<\/span>. Sprawdź, czy mieści się cały harmonogram, nie tylko każde zadanie z osobna."},{"label":"Zbadaj powracającą usterkę oprogramowania","html":"Dokładnie opisz usterkę <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, odtwórz ją w mniejszym przypadku <span class=\"refwrap\">(<a href=\"#scheme-16\" class=\"ref\" data-ref=\"16\">16<\/a>)<\/span> i przeprowadź kontrolowane testy <span class=\"refwrap\">(<a href=\"#scheme-4\" class=\"ref\" data-ref=\"4\">4<\/a>)<\/span>. Zapisuj każdy wynik i zmieniaj hipotezę, gdy dowody przestają ją wspierać <span class=\"refwrap\">(<a href=\"#scheme-36\" class=\"ref\" data-ref=\"36\">36<\/a>)<\/span>."},{"label":"Sprawdź, czy przekształcenie jest możliwe","html":"Zapisz dozwolone ruchy <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, eksperymentuj na małych przypadkach <span class=\"refwrap\">(<a href=\"#scheme-23\" class=\"ref\" data-ref=\"23\">23<\/a>)<\/span> i poszukaj zachowywanej wielkości <span class=\"refwrap\">(<a href=\"#scheme-27\" class=\"ref\" data-ref=\"27\">27<\/a>)<\/span>. Jeśli stan początkowy i docelowy różnią się pod jej względem, wyjaśnij, dlaczego każdy dozwolony ruch ją zachowuje, zanim uznasz cel za nieosiągalny."}],"note":["Cel i test sukcesu","Znane fakty i niewiadome","Bezwzględne ograniczenia i niesprawdzone założenia","Wybrany schemat i powód wyboru","Następne działanie i czego ma mnie nauczyć","Wynik i dowody","Co nadal wymaga sprawdzenia","Kontynuować, poprawić czy zakończyć","Wniosek do ponownego wykorzystania"],"sources":[{"id":"s1","code":"S1","title":"Heurystyki i szacowanie","fields":[{"label":"Dokument","html":"<a href=\"heuristics&amp;amp;estimation_in_problem_solving_2024_12_19.docx\" class=\"doc-link\">heuristics&amp;estimation_in_problem_solving_2024_12_19.docx<\/a>"},{"label":"Zakres przeglądu","html":"Cały tekst główny wraz z bibliografią. Najważniejsze treści: rozumowanie wstecz, analogia, dekompozycja, próby i błędy, stopniowe ulepszanie, szacowanie, kalibracja oraz ostrzeżenia przed błędami w ocenianiu. Bibliografia jest częścią dostarczonego dokumentu, a nie zbiorem niezależnie zweryfikowanych źródeł."},{"label":"Dobór treści","html":"Zachowano ogólne metody, które można zastosować w praktyce. Dostępność, reprezentatywność i zakotwiczenie potraktowano jako zjawiska wymagające kontroli, nie wskazówki do naśladowania. Pominięto ogólne twierdzenia o zastosowaniach zawodowych i skuteczności potwierdzanej badaniami, ponieważ nie wnoszą dodatkowej procedury do wykorzystania."}]},{"id":"s2","code":"S2","title":"Relaksacja problemu","fields":[{"label":"Dokument","html":"<a href=\"problem_relaxation_2025_01_04.docx\" class=\"doc-link\">problem_relaxation_2025_01_04.docx<\/a>"},{"label":"Zakres przeglądu","html":"Cały tekst główny, w tym wstępny przegląd, dodatkowe techniki matematyczne i obie części edukacyjne. Najważniejsze treści: relaksacja ograniczeń i relaksacja ciągła, oszacowania graniczne, kary, stopniowe dodawanie ograniczeń, podejmowanie decyzji etapami, informacje zwrotne między poziomami planowania oraz prostsze przypadki."},{"label":"Dobór treści i korekty","html":"Zachowano ogólne procedury zamiast specjalistycznych instrukcji dla programów optymalizacyjnych. Odróżniono łatwiejszy przykład dydaktyczny od formalnej relaksacji. Nie powtórzono twierdzeń, że każdy problem wypukły ma jednoznaczne optimum lub że proste zaokrąglenie daje poprawną odpowiedź. Wykluczono błędne przykłady: rozłożenie sześcianu nie zamienia ścieżki po powierzchni w ścieżkę biegnącą wyłącznie po krawędziach; równania <code>5c + 3d = 100<\/code> i <code>c + d = 25<\/code> wymuszają <code>c = d = 12.5<\/code>, więc nie mają rozwiązania całkowitoliczbowego; twierdzenie o półkolu jako rozwiązaniu dla dowolnych figur pod parabolą jest nieuzasadnione. Przykład ze słupkami ogrodzenia miesza również rozumowanie o stałym obwodzie z parami dzielników. Tych przykładów nie należy traktować jako instrukcji."}]},{"id":"s3","code":"S3","title":"Myślenie matematyczne i rozwiązywanie problemów","fields":[{"label":"Dokument","html":"<a href=\"problem‑solving_heuristics_2026_04_26.docx\" class=\"doc-link\">problem‑solving_heuristics_2026_04_26.docx<\/a>"},{"label":"Zakres przeglądu","html":"Wszystkie dziesięć części. Najważniejsze treści: jasne sformułowanie problemu, cykl zrozumienie-plan-wykonanie-ocena, sposoby przedstawienia, jednostki, przypadki graniczne, symetria, uporządkowane podejmowanie decyzji oraz modele systemów i bodźców wpływających na uczestników. Omówienie poszukiwania ewolucyjnego i wychodzenia z optimów lokalnych uzupełnia schemat 5; analogia i dekompozycja uzupełniają schematy 2 i 3."},{"label":"Dobór treści","html":"Ogólne podejścia przełożono na wyraźnie oznaczone procedury do samodzielnego zastosowania. Nie przedstawiono nazwanych algorytmów przeszukiwania jako zamiennych ani nie powtórzono ogólnego twierdzenia, że żaden z nich nie może gwarantować optymalności. Pominięto szerokie twierdzenia historyczne i metafory chemiczne tam, gdzie nie prowadziły do odrębnego działania możliwego do sprawdzenia."}]},{"id":"s4","code":"S4","title":"Sztuka i rzemiosło rozwiązywania problemów","fields":[{"label":"Dokument","html":"<a href=\"the-art-and-craft-of-problem-solving.pdf\" class=\"doc-link\">the-art-and-craft-of-problem-solving.pdf<\/a>"},{"label":"Autor i wydanie","html":"Paul Zeitz, wydanie drugie. Odwołania do stron używają numeracji drukowanej, nie pozycji w przeglądarce PDF."},{"label":"Przegląd pod kątem metod wielokrotnego użytku","html":"Spis treści i wskazówki dotyczące lektury; omówienia metod i wybrane rozwiązane przykłady w podrozdziałach 2.2-2.4, 3.2-3.4, 6.1-6.4 i 8.4. Porównano wyrenderowaną stronę geometryczną dotyczącą zasady ekstremalnej z wyodrębnionym tekstem. Główne uzupełnienia: sprawdzanie hipotez, sprzeczność, elementy skrajne, zasada szufladkowa, niezmienniki, monowarianty, indukcja i rekurencja, dopełnienia, zliczanie na dwa sposoby oraz konstrukcje pomocnicze."},{"label":"Dobór treści","html":"To przegląd metod, nie rozwiązanie ani przepisanie zbioru ćwiczeń z książki. Specjalistyczne narzędzia algebry, teorii liczb, analizy matematycznej i geometrii wykraczają poza ten przewodnik, chyba że ujawniają schemat o szerokim zastosowaniu. Książka uzupełnia również opisane wcześniej rozumowanie wstecz, upraszczanie, zmianę sposobu przedstawienia, symetrię i myślenie za pomocą grafów."}]},{"id":"s5","code":"S5","title":"Heurystyki w nauczaniu i uczeniu się matematyki","fields":[{"label":"Dokument","html":"<a href=\"Heuristics in Problem Solving for the Teaching and Learning of Mathematics.pdf&amp;gt;\" class=\"doc-link\">Heuristics in Problem Solving for the Teaching and Learning of Mathematics.pdf&gt;<\/a>"},{"label":"Autor i data","html":"Nuno Álvaro Ferreira Rodrigues, rozprawa doktorska, Uniwersytet w Coimbrze, 2015. Odwołania do stron używają numeracji drukowanej."},{"label":"Przegląd pod kątem metod wielokrotnego użytku","html":"Streszczenie, spis treści, wybrane omówienia metapoznania i rozwiązywania problemów na s. 27-28 i 48-50, wnioski w okolicy s. 212-213 oraz plan aneksu i wskazówki metodyczne na s. 215-226. Przeanalizowano wybrane rozwiązane przykłady na s. 236-237, 252-253, 285-286, 320-333 i końcowe omówienie paradoksu wizualnego na s. 402-405. Sprawdzono wizualnie schemat cyklicznego procesu na s. 223 i porównanie metod wyznaczania tras na s. 285."},{"label":"Najważniejsze treści","html":"Systematyczne wyliczanie i eliminacja, wyznaczanie tylko szukanej wielkości, konstrukcja zachłanna z wyraźnym kontrprzykładem dla jej optymalności oraz kontrolowanie i poprawianie procesu rozwiązywania. Wcześniejsze schematy uzupełniono konkretnymi przykładami sposobów przedstawienia, relaksacji, konstrukcji pomocniczych, symetrii i wyborów skrajnych."},{"label":"Dobór treści","html":"Aneks potraktowano jako źródło przeanalizowanych schematów rozumowania, nie powód do kopiowania każdego ćwiczenia matematycznego czy anegdoty historycznej. Rozprawa opisuje ograniczenia krótkiej interwencji w klasie, dlatego przewodnik nie twierdzi, że samo nauczenie się listy heurystyk gwarantuje poprawę wyników. Nadal potrzebne są praktyka, wiedza z danej dziedziny i kontrola własnego rozumowania."}]}],"title":"Praktyczne heurystyki rozwiązywania problemów","howH":"Jak korzystać z przewodnika","chooserH":"Jak szybko wybrać schemat","schemesH":"Schematy","combineH":"Łączenie schematów w praktyce","combineIntro":"Te przykłady ilustrują użycie przewodnika; nie są dodatkowymi studiami przypadków pochodzącymi ze źródeł.","noteH":"Szablon notatki roboczej","noteIntro":"Skopiuj te pytania pomocnicze, gdy zaczynasz pracę nad problemem:","sourcesH":"Przegląd źródeł w kolejności lektury","sourcesIntro":"Poniżej uwzględniono wszystkie pięć dokumentów dotyczących tematu z tego folderu, z pominięciem plików HTML. Trzy dokumenty Word przeczytano w całości w postaci tekstu. W dwóch obszernych plikach PDF przejrzano wskazane niżej części i przykłady pod kątem metod rozwiązywania problemów. Nie opracowano wyczerpująco zbiorów ćwiczeń ani przeglądów literatury. Teksty źródłowe pozostały bez zmian.","labels":{"desc":"Opis","useful":"Kiedy się przydaje","steps":"Procedura","watch":"Uwaga","sources":"Źródła"}}};
const T = {
  pl: {
    navIntro: 'Wstęp', navChooser: 'Od czego zacząć', navSchemes: 'Schematy', navSources: 'Źródła',
    searchLabel: 'Szukaj w schematach', searchPh: 'Szukaj schematu…',
    stepsH: 'W czterech krokach',
    howSteps: [['Zapisz', 'co chcesz osiągnąć, co wiesz i jakie warunki musi spełniać odpowiedź'], ['Wybierz', 'jeden schemat pasujący do napotkanej trudności'], ['Notuj', 'swoje próby i to, czego się z nich dowiadujesz'], ['Sprawdź', 'wynik względem pierwotnego problemu, zanim go przyjmiesz']],
    legend: [['green', 'Kiedy się przydaje'], ['blue', 'Procedura w 5 krokach'], ['yellow', 'Uwaga: gdzie schemat zawodzi']],
    chooserP: 'Dwanaście typowych trudności. Każda prowadzi do rozdziału z pasującymi schematami.',
    sideChapters: 'Rozdziały', sideOther: 'Strona',
    schemesIn: n => `${n} ${n === 1 ? 'schemat' : n < 5 ? 'schematy' : 'schematów'}`,
    countAll: n => `${n} schematów`, countSome: (v, n) => `${v} z ${n} schematów`,
    clear: 'Pokaż wszystkie', empty: 'Brak schematów pasujących do wyszukiwania.',
    footL: 'edulab · heurystyki', footR: '/ szukaj · Esc wyczyść · L język',
  },
  en: {
    navIntro: 'Intro', navChooser: 'Where to start', navSchemes: 'Schemes', navSources: 'Sources',
    searchLabel: 'Search schemes', searchPh: 'Search schemes…',
    stepsH: 'In four steps',
    howSteps: [['Write down', 'what you want to achieve, what you know, and what a valid answer must satisfy'], ['Choose', 'one scheme that matches your obstacle'], ['Record', 'what you try and what it teaches you'], ['Check', 'the result against the original problem before accepting it']],
    legend: [['green', 'Useful for'], ['blue', 'Procedure in 5 steps'], ['yellow', 'Watch out: where the scheme fails']],
    chooserP: 'Twelve typical obstacles. Each one leads to a chapter with the matching schemes.',
    sideChapters: 'Chapters', sideOther: 'Page',
    schemesIn: n => `${n} scheme${n === 1 ? '' : 's'}`,
    countAll: n => `${n} schemes`, countSome: (v, n) => `${v} of ${n} schemes`,
    clear: 'Show all', empty: 'No schemes match your search.',

};
const LANG_KEY = 'heuristics-guide.lang';
const ICONS = {
  when: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>',
  steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  watch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17h.01"/></svg>',
  intro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4zM8 9h8M8 13h6"/></svg>',
  chooser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M7 12h10M10 18h4"/></svg>',
  sources: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg>',
};
const cIdx = k => ((k - 1) % 6) + 1;

// ─── State ───
const state = { lang: 'pl', query: '' };

// ─── DOM refs ───
const $ = id => document.getElementById(id);
const els = { search: $('search'), side: $('side'), title: $('title'), introText: $('intro-text'), howBody: $('howBody'), howH: $('howH'), howSteps: $('howSteps'), legend: $('legend'), chooserH: $('chooserH'), chooserGrid: $('chooserGrid'), schemesH: $('schemesH'), status: $('status'), clearBtn: $('clearBtn'), chapters: $('chapters'), empty: $('empty'), sourcesH: $('sourcesH'), sourcesIntro: $('sourcesIntro'), sourceList: $('sourceList'), menuBtn: $('menuBtn'), scrim: $('scrim') };

// ─── Helpers ───
const t = key => T[state.lang][key];
const d = () => DATA[state.lang];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const strip = html => { const e = document.createElement('div'); e.innerHTML = html; return e.textContent; };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const schemeText = s => norm([s.n, s.title, s.desc, s.useful, s.watch, s.sources, ...s.steps].map(strip).join(' '));
const colorStyle = k => `--c: var(--c${cIdx(k)}); --c-ink: var(--c${cIdx(k)}-ink)`;

// ─── Render ───
function renderStatic() {
  const L = d();
  const byN = Object.fromEntries(L.schemes.map(s => [s.n, s]));
  document.documentElement.lang = state.lang;
  document.body.dataset.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  els.search.placeholder = t('searchPh');
  document.title = `${L.title} – edulab`;

  // Intro
  els.title.textContent = L.title;
  els.introText.innerHTML = L.intro.map(p => `<p class="lead">${p}</p>`).join('');
  els.howH.textContent = L.howH;
  els.howBody.innerHTML = L.how.map(p => `<p>${p}</p>`).join('');
  els.howSteps.innerHTML = t('howSteps').map(([a, b], i) => `<li><b>${i + 1}</b><div><strong>${a}</strong><span>${b}</span></div></li>`).join('');
  els.legend.innerHTML = t('legend').map(([c, txt]) => `<span><i style="background:var(--${c});color:var(--${c}-ink)">${c === 'green' ? '✓' : c === 'blue' ? '1' : '!'}</i>${txt}</span>`).join('');

  // Side menu
  els.side.innerHTML = '';
  els.side.appendChild(el('p', 'edu-overline', t('sideOther')));
  [['intro', 'navIntro', 'intro'], ['chooser', 'navChooser', 'chooser'], ['sources', 'navSources', 'sources']].forEach(([id, key, ico]) => {
    const a = el('a', 'side-link', `<span class="ico">${ICONS[ico]}</span><span></span>`); a.href = `#${id}`; a.dataset.sec = id; a.querySelector('span:last-child').textContent = t(key);
    els.side.appendChild(a);
  });
  els.side.appendChild(el('p', 'edu-overline', t('sideChapters')));

  // Chooser + chapters
  els.chooserH.textContent = L.chooserH;
  els.chooserGrid.innerHTML = ''; els.chapters.innerHTML = '';
  L.chooser.forEach((row, i) => {
    const k = i + 1;
    const a = el('a', null, `<span class="badge">${k}</span><strong></strong><small></small>`);
    a.href = `#ch-${k}`; a.style = colorStyle(k);
    a.querySelector('strong').textContent = row.obstacle;
    a.querySelector('small').textContent = row.starts.map(s => s.n).join(' · ');
    els.chooserGrid.appendChild(a);

    const g = el('div', 'side-group'); g.dataset.ch = k;
    const link = el('a', 'side-link', `<span class="dot">${k}</span><span></span>`); link.href = `#ch-${k}`; link.style = colorStyle(k); link.dataset.sec = `ch-${k}`;
    link.querySelector('span:last-child').textContent = row.obstacle;
    const sub = el('ul', 'side-sub');
    row.starts.forEach(({ n }) => { const li = el('li'); li.dataset.n = n; const sa = el('a', null, `<i>${n}</i><span></span>`); sa.href = `#scheme-${n}`; sa.dataset.n = n; sa.querySelector('span').textContent = byN[n].title; li.appendChild(sa); sub.appendChild(li); });
    g.append(link, sub); els.side.appendChild(g);

    const ch = el('section', 'chapter'); ch.id = `ch-${k}`; ch.dataset.ch = k; ch.style = colorStyle(k);
    const head = el('div', 'chapter-head edu-block', `<span class="n">${k}</span><div><h2></h2><small></small></div>`);
    head.dataset.light = String(cIdx(k) === 5);
    head.querySelector('h2').textContent = row.obstacle;
    head.querySelector('small').textContent = t('schemesIn')(row.starts.length);
    ch.appendChild(head);
    row.starts.forEach(({ n }) => {
      const s = byN[n];
      const art = el('article', 'scheme'); art.id = `scheme-${n}`; art.dataset.n = n;
      art.innerHTML = `
        <div class="head"><span class="num">${n}</span><h3></h3><p class="desc">${s.desc}</p></div>
        <div class="s-grid">
          <div class="s-side">
            <div class="box box-green edu-block"><span class="tag">${ICONS.when}${L.labels.useful}</span><p>${s.useful}</p></div>
            <div class="box box-yellow edu-block"><span class="tag">${ICONS.watch}${L.labels.watch}</span><p>${s.watch}</p></div>
          </div>
          <div class="box box-steps"><span class="tag">${ICONS.steps}${L.labels.steps}</span><ol class="steps">${s.steps.map(x => `<li><span>${x}</span></li>`).join('')}</ol></div>
        </div>
        <p class="src">${L.labels.sources}: ${s.sources}</p>`;
      art.querySelector('h3').textContent = s.title;
      ch.appendChild(art);
    });
    els.chapters.appendChild(ch);
  });
  els.schemesH.textContent = L.schemesH;
  els.empty.textContent = t('empty');
  els.clearBtn.textContent = t('clear');

  // Sources
  els.sourcesH.textContent = L.sourcesH;
  els.sourcesIntro.innerHTML = L.sourcesIntro;
  els.sourceList.innerHTML = '';
  L.sources.forEach(src => {
    const card = el('article', 'source'); card.id = src.id;
    card.innerHTML = `<div class="code">${src.code}</div><div><h3></h3><dl>${src.fields.map(f => `<dt>${f.label}</dt><dd>${f.html}</dd>`).join('')}</dl></div>`;
    card.querySelector('h3').textContent = src.title;
    els.sourceList.appendChild(card);
  });
  applyFilter();
}

function applyFilter() {
  const L = d(); const q = norm(state.query.trim());
  let visible = 0;
  L.schemes.forEach(s => { const show = !q || schemeText(s).includes(q); $(`scheme-${s.n}`).hidden = !show; const li = els.side.querySelector(`li[data-n="${s.n}"]`); if (li) li.hidden = !show; if (show) visible++; });
  document.querySelectorAll('.chapter').forEach(ch => {
    const any = ch.querySelector('.scheme:not([hidden])') != null;
    ch.hidden = !any; els.side.querySelector(`.side-group[data-ch="${ch.dataset.ch}"]`).hidden = !any;
  });
  const n = L.schemes.length;
  els.chapters.dataset.visibleCount = visible; els.chapters.dataset.query = q;
  els.status.textContent = visible === n ? t('countAll')(n) : t('countSome')(visible, n);
  els.clearBtn.hidden = !q;
  els.empty.hidden = visible > 0;
  updateActive();
}

function updateActive() {
  const top = 120;
  let sec = 'intro';
  ['intro', 'chooser', 'schemes', 'sources'].forEach(id => { if ($(id).getBoundingClientRect().top <= top) sec = id; });
  document.querySelectorAll('#topnav a').forEach(a => a.setAttribute('aria-current', String(a.dataset.sec === sec)));
  let ch = null, sch = null;
  if (sec === 'schemes') {
    document.querySelectorAll('.chapter:not([hidden])').forEach(c => { if (c.getBoundingClientRect().top <= top) ch = c.dataset.ch; });
    document.querySelectorAll('.scheme:not([hidden])').forEach(s => { if (s.getBoundingClientRect().top <= top + 40) sch = s.dataset.n; });
  }
  els.side.querySelectorAll('.side-link').forEach(a => a.setAttribute('aria-current', String(a.dataset.sec === (ch ? `ch-${ch}` : sec))));
  els.side.querySelectorAll('.side-group').forEach(g => { g.dataset.open = String(g.dataset.ch === ch); });
  els.side.querySelectorAll('.side-sub a').forEach(a => a.setAttribute('aria-current', String(a.dataset.n === sch)));
  document.body.dataset.section = sec; document.body.dataset.chapter = ch || '';
}

// ─── Actions ───
function setLang(lang) { state.lang = lang; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} renderStatic(); }
function clearSearch() { state.query = ''; els.search.value = ''; applyFilter(); }
function flash(n) { const a = $(`scheme-${n}`); if (!a) return; a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash'); }
function setMenu(open) { document.body.dataset.menu = open ? 'open' : 'closed'; els.menuBtn.setAttribute('aria-expanded', String(open)); }

// ─── Listeners ───
document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
els.search.addEventListener('input', () => { state.query = els.search.value; applyFilter(); });
els.clearBtn.addEventListener('click', clearSearch);
els.menuBtn.addEventListener('click', () => setMenu(document.body.dataset.menu !== 'open'));
els.scrim.addEventListener('click', () => setMenu(false));
els.side.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; if (a.dataset.n) flash(+a.dataset.n); if (window.innerWidth <= 900) setMenu(false); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') { e.target.blur(); clearSearch(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); els.search.focus(); }
  else if (e.key.toLowerCase() === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
  else if (e.key === 'Escape') { clearSearch(); setMenu(false); }
});
document.addEventListener('scroll', updateActive, { passive: true });
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#scheme-(\d+)$/); if (m) flash(+m[1]); });

// ─── Init ───
try { const saved = localStorage.getItem(LANG_KEY); if (saved === 'pl' || saved === 'en') state.lang = saved; } catch (e) {}
renderStatic();
{ const m = location.hash.match(/^#scheme-(\d+)$/); if (m) { flash(+m[1]); $(`scheme-${m[1]}`).scrollIntoView(); } }
</script>

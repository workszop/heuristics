<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heurystyki rozwiązywania problemów – edulab</title>
<style>
/* ─── edulab tokens (subset of edustyl/tokens/colors_and_type.css) ─── */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --paper:    #FFFFFF;
  --paper-2:  #FBF7E6;
  --paper-3:  #F5EDCB;
  --surface:  #FFFFFF;

  --ink:      #1C1917;
  --ink-2:    #57534E;
  --ink-3:    #948C82;
  --line:     #EDE7D2;
  --line-2:   #DDD4B6;

  --yellow:      #FFD500;  --yellow-600: #F0C800;  --yellow-ink: #1C1917;
  --blue:        #1E8FC2;  --blue-600:   #177AA8;  --blue-ink:   #FFFFFF;
  --green:       #00A651;  --green-600:  #009444;  --green-ink:  #FFFFFF;
  --red:         #E5322D;  --red-600:    #C92823;  --red-ink:    #FFFFFF;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;

  --on-primary: #1C1917;
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary: 0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);

  /* chapter colours: six hues cycled across the twelve chapters */
  --c1: var(--blue);       --c1-ink: var(--blue-ink);
  --c2: var(--green);      --c2-ink: var(--green-ink);
  --c3: var(--play-grape); --c3-ink: var(--paper);
  --c4: var(--play-berry); --c4-ink: var(--paper);
  --c5: var(--yellow);     --c5-ink: var(--yellow-ink);
  --c6: var(--ink);        --c6-ink: var(--paper);

  --header-h: 72px;
  --side-w: 300px;
}

/* ─── Base ─── */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 20px); }
body.edu { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; }
.edu h1, .edu h2, .edu h3, .edu h4 { font-family: var(--font-display); color: var(--ink); margin: 0; }
.edu p { margin: 0; color: var(--ink-2); font-size: 16px; }
.edu p + p { margin-top: 12px; }
.edu a { color: var(--blue-600); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.edu code { font-family: var(--font-mono); font-size: .92em; color: var(--ink); background: var(--paper-3); padding: .1em .35em; border-radius: var(--r-xs); }
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p, .edu-block li { color: inherit; }
.edu-overline, .edu p.edu-overline { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.edu-overline { margin: 0; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-xs); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
[hidden] { display: none !important; }

/* ─── Top menu ─── */
.edu-header { position: sticky; top: 0; z-index: 50; height: var(--header-h); background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.edu-header-inner { height: 100%; padding: 0 28px; display: flex; align-items: center; gap: 14px; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.topnav { display: flex; gap: 4px; margin-left: 22px; }
.edu .topnav a { font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); text-decoration: none; padding: 8px 14px; border-radius: var(--r-pill); transition: background .15s, color .15s; }
.topnav a:hover { background: var(--paper-2); color: var(--ink); }
.topnav a[aria-current="true"] { background: var(--yellow); color: var(--yellow-ink); }
.tools { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; background: var(--paper-2); border-radius: var(--r-pill); padding: 8px 14px; width: 240px; }
.search svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.search input { border: 0; background: transparent; font-family: var(--font-sans); font-size: 14px; color: var(--ink); width: 100%; outline: none; }
.search input::placeholder { color: var(--ink-3); }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
.edu-seg button { border: none; background: transparent; padding: 7px 13px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; transition: background .15s, color .15s; }
.edu-seg button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.menu-btn { display: none; width: 40px; height: 40px; border: 0; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); cursor: pointer; place-items: center; }
.menu-btn svg { width: 20px; height: 20px; }

/* ─── Shell: side menu + content ─── */
.shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: calc(100vh - var(--header-h)); }
.side { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; background: var(--paper-2); border-right: 1px solid var(--line); padding: 22px 16px 40px; }
.side .edu-overline { color: var(--ink-3); padding: 0 12px; margin: 18px 0 8px; }
.side .edu-overline:first-child { margin-top: 0; }
.edu .side-link { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-pill); color: var(--ink-2); font-size: 14px; font-weight: 500; text-decoration: none; line-height: 1.3; transition: background .15s, color .15s; }
.side-link:hover { background: var(--paper-3); color: var(--ink); }
.side-link[aria-current="true"] { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.side-link .dot { flex: none; width: 22px; height: 22px; border-radius: var(--r-pill); background: var(--c); color: var(--c-ink); font-family: var(--font-mono); font-size: 11px; display: grid; place-items: center; }
.side-link .ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink-3); }
.side-link .ico svg { width: 16px; height: 16px; }
.side-link[aria-current="true"] .ico { color: var(--yellow-ink); }
.side-group { margin: 2px 0; }
.side-sub { list-style: none; margin: 2px 0 6px; padding: 0 0 0 26px; display: none; }
.side-group[data-open="true"] .side-sub { display: block; }
.edu .side-sub a { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: baseline; padding: 5px 10px; border-radius: var(--r-sm); color: var(--ink-2); font-size: 13px; line-height: 1.35; text-decoration: none; }
.side-sub a:hover { background: var(--paper-3); color: var(--ink); }
.side-sub a[aria-current="true"] { color: var(--ink); font-weight: 600; }
.side-sub a i { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.scrim { display: none; }

.content { min-width: 0; padding: 40px 48px 100px; }
.content > * { max-width: 1000px; }
section.block { margin-top: 64px; }
.section-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.section-head h2 { font-weight: 700; font-size: 30px; letter-spacing: -.02em; line-height: 1.1; }
.section-head .ico { width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--paper); flex: none; }
.section-head .ico svg { width: 22px; height: 22px; }

/* ─── Intro ─── */
.hero h1 { font-weight: 800; font-size: clamp(2.2rem, 4vw, 3rem); letter-spacing: -.025em; line-height: 1.05; margin-bottom: 18px; }
.hero .lead { font-size: 17.5px; }
.hero-grid { margin-top: 28px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
.panel { border-radius: var(--r-xl); padding: 30px 32px; }
.panel-blue { background: var(--blue); color: var(--blue-ink); }
.panel-blue .edu-overline { color: rgba(255,255,255,.7); margin-bottom: 8px; }
.panel-blue p { font-size: 16.5px; line-height: 1.55; }
.panel-sand { background: var(--paper-2); }
.panel-sand .edu-overline { color: var(--ink-3); margin-bottom: 12px; }
.howto-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.howto-steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.howto-steps b { width: 34px; height: 34px; border-radius: var(--r-pill); background: var(--yellow); color: var(--yellow-ink); font-family: var(--font-display); font-weight: 700; font-size: 15px; display: grid; place-items: center; }
.howto-steps strong { display: block; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); }
.howto-steps span { font-size: 14px; color: var(--ink-2); line-height: 1.45; }

/* ─── Legend ─── */
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 12px 6px 6px; }
.legend i { width: 22px; height: 22px; border-radius: var(--r-pill); display: grid; place-items: center; font-style: normal; font-family: var(--font-mono); font-size: 10px; }

/* ─── Chapter chooser ─── */
.chooser { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.edu .chooser a { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 18px 16px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow-sm); transition: box-shadow .2s; }
.chooser a:hover { box-shadow: var(--shadow-md); }
.chooser .badge { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--c); color: var(--c-ink); font-family: var(--font-display); font-weight: 700; font-size: 15px; display: grid; place-items: center; }
.chooser strong { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.3; color: var(--ink); }
.chooser small { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; color: var(--ink-3); }

/* ─── Chapters ─── */
.status { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.status button { font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--paper-2); border: 0; border-radius: var(--r-pill); padding: 6px 12px; cursor: pointer; }
.chapter { margin-top: 44px; }
.chapter:first-child { margin-top: 0; }
.chapter-head { display: grid; grid-template-columns: 56px 1fr; gap: 18px; align-items: center; background: var(--c); color: var(--c-ink); border-radius: var(--r-lg); padding: 22px 26px; margin-bottom: 16px; }
.chapter-head .n { width: 56px; height: 56px; border-radius: var(--r-md); background: rgba(255,255,255,.22); font-family: var(--font-display); font-weight: 800; font-size: 26px; display: grid; place-items: center; }
.chapter-head[data-light="true"] .n { background: rgba(28,25,23,.12); }
.chapter-head h2 { font-weight: 700; font-size: 24px; letter-spacing: -.02em; line-height: 1.15; color: inherit; }
.chapter-head small { display: block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; margin-top: 4px; }

.scheme { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 26px 28px 22px; margin-top: 14px; }
.scheme.flash { animation: flash 1.8s ease both; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--yellow); } 100% { box-shadow: var(--shadow-sm); } }
.scheme .head { display: grid; grid-template-columns: 46px 1fr; gap: 8px 16px; align-items: center; }
.scheme .num { width: 46px; height: 46px; border-radius: var(--r-md); background: var(--c); color: var(--c-ink); font-family: var(--font-display); font-weight: 800; font-size: 21px; display: grid; place-items: center; }
.scheme h3 { font-weight: 600; font-size: 21px; letter-spacing: -.015em; line-height: 1.2; }
.scheme .desc { grid-column: 2; font-size: 16px; color: var(--ink); line-height: 1.55; max-width: 70ch; }
.s-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; margin-top: 20px; }
.s-side { display: grid; gap: 14px; align-content: start; }
.box { border-radius: var(--r-md); padding: 14px 16px; }
.box-green { background: var(--green); color: var(--green-ink); }
.box-yellow { background: var(--yellow); color: var(--yellow-ink); }
.box-steps { background: var(--paper-2); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.tag svg { width: 14px; height: 14px; }
.box p { font-size: 14.5px; line-height: 1.5; }
.box-green .tag, .box-yellow .tag { color: inherit; opacity: .85; }
.box-steps .tag { color: var(--blue-600); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.5; color: var(--ink); }
.steps li::before { counter-increment: step; content: counter(step); width: 26px; height: 26px; border-radius: var(--r-pill); background: var(--blue); color: var(--blue-ink); font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
.src { margin-top: 16px; font-size: 13px; color: var(--ink-3); }
.src a { color: var(--ink-2); }
.empty { padding: 48px 20px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }

/* ─── Sources ─── */
.source { display: grid; grid-template-columns: 56px 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; box-shadow: var(--shadow-sm); margin-top: 14px; }
.source .code { width: 56px; height: 56px; border-radius: var(--r-md); background: var(--ink); color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 20px; display: grid; place-items: center; }
.source h3 { font-size: 19px; font-weight: 600; margin-bottom: 8px; }
.source dl { margin: 0; display: grid; gap: 9px; }
.source dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue-600); }
.source dd { margin: 2px 0 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }

footer { border-top: 1px solid var(--line); margin-top: 40px; }
footer div { padding: 18px 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--ink-3); }

@media (max-width: 1100px) { .topnav { display: none; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .menu-btn { display: grid; }
  .side { position: fixed; left: 0; top: var(--header-h); width: min(88vw, 340px); z-index: 45; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); }
  body[data-menu="open"] .side { transform: none; }
  body[data-menu="open"] .scrim { display: block; position: fixed; inset: var(--header-h) 0 0 0; background: rgba(28,25,23,.35); z-index: 40; }
  .content { padding: 28px 20px 80px; }
  .hero-grid, .chooser, .s-grid { grid-template-columns: 1fr; }
  .search { width: 160px; }
}
@media (max-width: 768px) {
  .search { display: none; }
  .scheme { padding: 20px 18px 18px; }
  .scheme .desc { grid-column: 1 / -1; }
  .chapter-head { grid-template-columns: 44px 1fr; padding: 18px 20px; }
  .chapter-head .n { width: 44px; height: 44px; font-size: 20px; }
}
@media print { .edu-header, .side, footer, .status { display: none; } .shell { display: block; } .scheme, .source { break-inside: avoid; } }
</style>
</head>

<script>
// ─── Constants ───
const DATA = {"en":{"lang":"en","intro":["A heuristic is a useful way to look for a solution, not a guarantee that the solution is correct or best. This guide collects reusable schemes from the non-HTML documents in this folder. Each scheme explains when to use it and what to do next.","The procedures are plain-language adaptations, not quotations. Examples outside mathematics illustrate how a scheme might transfer; they are not claims that the sources tested it in those settings. Similar ideas are combined rather than repeated. Short source codes point to the document review at the end."],"how":["Write down what you are trying to achieve, what you know, and which conditions a valid answer must satisfy. Choose one scheme that matches your obstacle. Record what you try and what it teaches you. Check the result against the original problem before accepting it.","Use the schemes as a menu, not a checklist to complete in order. You may need to return to the framing, switch methods, or combine two approaches. A heuristic helps you discover an answer; a proof, an appropriate test, or a feasibility check establishes what you can claim about it."],"chooser":[{"obstacle":"The question is vague or seems to lack information","starts":[{"n":17,"label":"Clarify the problem"},{"n":34,"label":"Find only what is asked"}]},{"obstacle":"You understand the goal but cannot see a route","starts":[{"n":1,"label":"Work backward"},{"n":2,"label":"Analogy"},{"n":32,"label":"Add an intermediate object"},{"n":4,"label":"Use controlled trial and error"}]},{"obstacle":"The problem is too large or tangled","starts":[{"n":3,"label":"Break into parts"},{"n":16,"label":"Try a small instance"},{"n":18,"label":"Change representation"}]},{"obstacle":"Constraints make every attempt fail","starts":[{"n":9,"label":"Relax a constraint"},{"n":10,"label":"Allow fractions"},{"n":13,"label":"Add justified restrictions"}]},{"obstacle":"You need a rough answer or a reality check","starts":[{"n":6,"label":"Estimate the scale"},{"n":7,"label":"Use comparable cases"},{"n":19,"label":"Check units and limits"}]},{"obstacle":"Many answers work, but you want a better one","starts":[{"n":5,"label":"Improve and restart"},{"n":11,"label":"Use bounds"},{"n":35,"label":"Try a greedy first pass"}]},{"obstacle":"The plan has stages or several decision levels","starts":[{"n":14,"label":"Commit in stages"},{"n":15,"label":"Check the details against the big plan"}]},{"obstacle":"Options involve uncertainty or conflicting interests","starts":[{"n":8,"label":"Check biases"},{"n":12,"label":"Price trade-offs"},{"n":21,"label":"Compare outcomes"},{"n":22,"label":"Map interactions"}]},{"obstacle":"You need to explore a pattern or general rule","starts":[{"n":23,"label":"Experiment and explain"},{"n":29,"label":"Recurrence or induction"},{"n":37,"label":"Generalize"}]},{"obstacle":"You suspect a claim or target is impossible","starts":[{"n":24,"label":"Test the opposite"},{"n":25,"label":"Use an extreme element"},{"n":27,"label":"Find an invariant"}]},{"obstacle":"The problem involves counting or arrangements","starts":[{"n":20,"label":"Symmetry"},{"n":26,"label":"Pigeonholes"},{"n":30,"label":"Complement"},{"n":31,"label":"Count twice"},{"n":33,"label":"Systematic cases"}]},{"obstacle":"A process repeats, or your own work has stalled","starts":[{"n":28,"label":"Track one-way change"},{"n":36,"label":"Review progress and revise the plan"}]}],"schemes":[{"n":1,"title":"Work backward from the goal","steps":["Describe the finished result precisely.","Ask, \"What would be enough to make this happen?\"","Repeat that question for each new requirement until you reach something already known or achievable.","Reverse the chain and carry out the steps from the actual starting point.","Check every forward step. A condition that is necessary for success may not be enough to produce it."],"desc":"Start with the result you want and ask what would have to be true immediately before it. Turn a distant goal into a chain of requirements.","useful":"Planning, finding missing prerequisites, solving equations, and constructing proofs.","watch":"Backward reasoning can suggest a route without proving that the route works.","sources":"<a href=\"#s1\">S1<\/a>; <a href=\"#s4\">S4<\/a>, section 2.2, the penultimate-step strategy, p. 27.","src":"s1"},{"n":2,"title":"Reuse the structure of a solved problem","steps":["List the main objects, relationships, constraints, and goal in the current problem.","Find a solved problem with a similar structure.","Map each important part of that problem to a part of this one.","Adapt its solution method.","Identify differences that could break the analogy and test them first."],"desc":"Find an earlier problem with the same underlying relationships, even if its subject looks different. Transfer the method, not just the answer.","useful":"Unfamiliar problems, design, troubleshooting, and learning a new subject.","watch":"Similar appearance is weak evidence. The relationships that made the earlier solution work must also apply here.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":3,"title":"Break the problem into parts","steps":["Separate the problem into parts with clear outputs.","Mark which parts depend on other parts.","Solve an independent part or an important prerequisite first.","Combine the partial results, including the work needed to connect them.","Test the whole result against the original goal and constraints."],"desc":"Replace one large task with smaller tasks whose results can be combined.","useful":"Projects, complex calculations, system design, and multi-stage investigations.","watch":"The parts may interact. Several good local solutions do not automatically make a good overall solution.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":4,"title":"Use controlled trial and error","steps":["Define a clear test for success.","Choose a plausible candidate and predict what should happen.","Test it with limited cost and risk.","Record what worked, what failed, and what the failure rules out.","Change one relevant feature when possible, then test again. Stop repeating attempts that teach you nothing."],"desc":"Try a candidate, learn from the result, and choose the next attempt deliberately.","useful":"Troubleshooting, prototypes, and small searches where tests are cheap and safe.","watch":"Unrecorded changes make it hard to know what caused an improvement. Do not experiment on an irreversible or dangerous system without safeguards.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":5,"title":"Improve a workable solution and escape dead ends","steps":["Define what makes one valid solution better than another.","Build a feasible starting solution.","Try nearby changes and keep useful improvements.","When progress stops, keep a copy of the best solution and try a restart or a larger change.","Compare the best candidates using the same criteria and stop at a stated time or quality limit."],"desc":"Start with an acceptable solution and improve it through small changes. If small changes stop helping, explore a different starting point or a larger change.","useful":"Schedules, layouts, routes, resource allocation, and designs with many possible answers.","watch":"Being better than all nearby alternatives does not mean being best overall. Preserve hard constraints while searching.","sources":"<a href=\"#s1\">S1<\/a>, \"Improvement heuristics\" and \"Meta-heuristic methods\"; <a href=\"#s3\">S3<\/a>, sections 7.2 and 8.2. This is a manual adaptation, not a full specification of those algorithms.","src":"s1"},{"n":6,"title":"Estimate the scale before calculating precisely","steps":["State the quantity and its unit.","Break it into quantities that are easier to estimate.","Choose rounded values and write down the assumptions behind them.","Combine the values, checking that the units make sense.","Change uncertain inputs to plausible low and high values. Report an approximate range rather than invented precision."],"desc":"Use rounded quantities and simple relationships to find the approximate size of an answer.","useful":"Early planning, quick feasibility checks, and catching implausible calculations.","watch":"An estimate is not an exact result, a guarantee, or a fixed-price commitment. Use a more rigorous method when the decision requires one.","sources":"<a href=\"#s1\">S1<\/a>, \"What is Estimation?\" and \"Improving Estimation Accuracy.\"","src":"s1"},{"n":7,"title":"Estimate from parts and comparable cases","steps":["Divide the work into non-overlapping pieces.","Estimate each piece using comparable completed work or a relevant rate, such as time per unit.","Include coordination, integration, and other work that does not belong to a single piece.","Compare the total with the result for a similar whole task. Investigate large differences.","After completion, compare estimate with outcome and update the assumptions for next time."],"desc":"Build an estimate from smaller pieces, then cross-check it against real examples or a rate measured in similar work.","useful":"Effort, capacity, quantity, and cost estimates where relevant past data exist.","watch":"Effort and elapsed time are different. Parallel work, dependencies, and shared risks affect the total; unfamiliar work may not fit historical rates.","sources":"<a href=\"#s1\">S1<\/a>, \"Improving Estimation Accuracy\" and \"Business.\"","src":"s1"},{"n":8,"title":"Check whether a mental shortcut is misleading you","steps":["Write down your first answer and why it feels plausible.","Ask whether it mainly comes from a recent or memorable example, a resemblance, or an initial number.","Seek relevant data and comparable cases, including evidence against your first answer.","Make a second estimate or explanation by a different route, without simply adjusting the first.","Compare the results and state what remains uncertain."],"desc":"Treat an immediate judgment as a starting hypothesis. Check whether vivid memories, stereotypes, or the first number you saw are driving it.","useful":"Uncertain judgments, interpreting evidence, and reviewing estimates.","watch":"Availability, representativeness, and anchoring describe possible judgment shortcuts, not reliable procedures for establishing truth.","sources":"<a href=\"#s1\">S1<\/a>, \"Examples of Common Heuristics\" and \"Limitations.\"","src":"s1"},{"n":9,"title":"Temporarily remove a difficult constraint","steps":["List the original constraints, separating actual requirements from assumptions or conventions.","Choose one difficult constraint and explicitly remove or weaken it in a working model.","Solve that version while keeping the original goal unchanged.","Inspect which original constraints the result violates.","Restore them one at a time, adapting the solution or using the result only as a bound or clue."],"desc":"Solve a less restricted version to discover what is possible and which conditions cause the difficulty. This is constraint relaxation.","useful":"Overconstrained plans, allocation, scheduling, and optimization.","watch":"A relaxed solution may be impossible in the real problem. Relax safety requirements only in a model, never by silently dropping them from the delivered result.","sources":"<a href=\"#s2\">S2<\/a>, \"Constraint Relaxation.\"","src":"s2"},{"n":10,"title":"Allow fractions first, then restore whole choices","steps":["Identify the whole-number or yes/no decisions.","Allow fractions within the same limits, preserving the other constraints and the objective.","Solve the relaxed version.","Search for feasible whole-number choices using the result as guidance.","Recheck every original constraint and compare the final value with the relaxed bound."],"desc":"Temporarily let indivisible choices take fractional values. The easier problem may reveal a useful target or bound. This is continuous relaxation.","useful":"Selecting items, assigning resources, and planning quantities that must eventually be whole numbers.","watch":"Rounding can violate a budget, capacity, or exact total. A nearby integer solution may not exist, and the best valid solution may be far away.","sources":"<a href=\"#s2\">S2<\/a>, \"Continuous Relaxation\" and \"Linear (LP) Relaxation.\"","src":"s2"},{"n":11,"title":"Use bounds to judge how much improvement is possible","steps":["State whether you are minimizing something, such as distance, or maximizing it, such as output.","Obtain a proven bound, for example by solving a valid constraint relaxation to optimality.","Find a solution satisfying all original constraints and measure its value.","For minimization, the relaxed optimum is a lower bound and the feasible value is an upper bound. For maximization, reverse those roles.","Compare the gap. If both values agree, you have established optimality; otherwise report the remaining gap honestly."],"desc":"Put the best possible answer between a proven limit and the value of a solution that actually works.","useful":"Optimization, feasibility checks, and deciding whether further search is worthwhile.","watch":"An arbitrary approximate solution to the relaxed problem is not automatically a certified bound. Changing the objective requires a separate justification of the bound.","sources":"<a href=\"#s2\">S2<\/a>, \"Mathematical problem relaxation\" and \"Concluding Remarks.\"","src":"s2"},{"n":12,"title":"Put an explicit cost on a trade-off","steps":["Separate non-negotiable constraints from targets you are allowed to trade off.","Define how to measure a target violation and assign it an explicit weight.","Compare candidate solutions using the original score plus the weighted violation costs.","Change the weights and see which choices change.","Present the trade-offs and check all non-negotiable constraints before choosing."],"desc":"In a working model, attach a cost to violating a negotiable target instead of treating every target as absolute. This exposes trade-offs and may separate a tangled problem into smaller ones.","useful":"Balancing preferences in schedules, resource use, and designs.","watch":"A penalty is not permission to break a hard requirement. This is a practical penalty-model adaptation of the source's Lagrangian discussion, not a formal Lagrangian algorithm; arbitrary penalty scores do not certify optimization bounds.","sources":"<a href=\"#s2\">S2<\/a>, \"Lagrangian Relaxation.\"","src":"s2"},{"n":13,"title":"Add missing restrictions as failures reveal them","steps":["Solve a simplified version of the problem.","Test the candidate against the original requirements.","Identify why it fails and express that failure as a general restriction.","Check that the restriction preserves every valid solution, then add it.","Solve again until the candidate passes or the model shows that no candidate can work."],"desc":"Start with a manageable model, inspect its proposed answer, and add a justified rule that excludes the specific invalid pattern. Repeat rather than writing every possible restriction upfront.","useful":"Complex planning models, configuration, and searches with many constraints.","watch":"Do not forbid a merely unfamiliar answer. A valid restriction must follow from the original problem, not from your preferences.","sources":"<a href=\"#s2\">S2<\/a>, \"Cutting Plane Methods.\" This is the human-scale pattern behind the formal method.","src":"s2"},{"n":14,"title":"Commit in stages while keeping later choices flexible","steps":["Divide decisions into stages or logical blocks.","Keep earlier decisions fixed, require valid discrete choices in the current block, and simplify later blocks.","Solve the current subproblem and check whether later work can still fit.","Fix the current block and move to the next.","If a later block becomes impossible, revisit earlier commitments rather than pretending the full plan works."],"desc":"Make a large sequence of decisions in blocks. Settle one block while using a simpler model of what comes later.","useful":"Multi-stage schedules and plans too large to settle in full at once.","watch":"Early choices can trap later stages. This is a heuristic, not a guarantee of feasibility or optimality.","sources":"<a href=\"#s2\">S2<\/a>, \"Relax-and-Fix Heuristics.\"","src":"s2"},{"n":15,"title":"Alternate the big plan with detailed feasibility checks","steps":["Separate high-level choices from the detailed work they imply.","Propose a high-level plan.","Work out the details under those choices, checking feasibility and cost.","If the details fail, identify the particular high-level combination responsible. Feed that restriction or cost information back into the plan.","Repeat until both levels agree, then check the complete solution."],"desc":"Choose a high-level plan, test whether its details can work, and use specific feedback to improve the plan.","useful":"Location choices, staffing plans, system design, and other decisions with a strategic layer and an operational layer.","watch":"Feedback must be justified and specific enough to improve the next proposal. This manual adaptation does not inherit the mathematical guarantees of formal decomposition algorithms.","sources":"<a href=\"#s2\">S2<\/a>, \"Benders Decomposition.\"","src":"s2"},{"n":16,"title":"Solve a small or simple instance first","steps":["Replace large numbers, many objects, or several dimensions with a manageable case.","Solve that case completely and record the important steps.","Try a slightly larger or less convenient case.","Identify what stayed the same and propose a reusable method.","Restore the original size and check why the method still applies."],"desc":"Reduce the size or complexity of the problem while keeping the relationship you want to understand.","useful":"Unfamiliar rules, counting, learning, prototypes, and finding a first foothold.","watch":"Making a smaller instance is not necessarily a formal optimization relaxation. Success in a special case is a clue, not proof of the general claim.","sources":"<a href=\"#s2\">S2<\/a>, \"Problem Relaxation in K-12 Math Problem-Solving,\" practical classroom strategies; <a href=\"#s3\">S3<\/a>, section 5.","src":"s2"},{"n":17,"title":"Clarify the problem and challenge hidden assumptions","steps":["State the question in your own words and describe what would count as success.","List the unknowns, the given facts, and the constraints.","Mark assumptions separately from facts. Ask which limits are real and which are habits or conventions.","Check whether the information is sufficient, contradictory, or irrelevant.","Choose a first plan, carry it out with checks, and review both the answer and the method."],"desc":"Turn a vague difficulty into a question with a clear goal, known information, and explicit conditions.","useful":"Almost any problem, especially disagreements about what needs solving.","watch":"Solving a neatly stated question is not useful if it is the wrong question. Confirm that the framing still serves the original goal.","sources":"<a href=\"#s3\">S3<\/a>, sections 3, 5, and 6; <a href=\"#s2\">S2<\/a>, the four problem-solving stages; <a href=\"#s5\">S5<\/a>, pp. 220-223, including the need to move back between stages.","src":"s3"},{"n":18,"title":"Change the representation","steps":["Identify what is hard to see in the current representation.","Choose a form that exposes it, such as a diagram for spatial relationships or a table for cases.","Label every important quantity and translate all constraints.","Solve or explore the new representation.","Translate the result back and check that nothing was lost or added."],"desc":"Describe the same problem in a form that makes its relationships easier to see: a picture, table, equation, physical model, or a different set of variables.","useful":"Dense verbal problems, awkward algebra, spatial relationships, and tangled dependencies.","watch":"An equivalent transformation preserves the problem. An approximation changes it and needs a separate check; a sketch is not proof of an exact relationship.","sources":"<a href=\"#s3\">S3<\/a>, section 5, \"Substitution or transformation\" and \"Abstraction\"; <a href=\"#s2\">S2<\/a>, concrete models.","src":"s3"},{"n":19,"title":"Check units and extreme cases","steps":["Attach units to all measured quantities and verify that both sides of each equation have compatible units.","Check simple inputs such as zero, one, equal quantities, or an empty case when allowed.","Examine what happens near the allowed minimum or maximum, or as a quantity becomes very large.","Compare the behavior with what the original situation requires.","Investigate any mismatch, including whether the model stops applying at that boundary."],"desc":"Test whether an answer has the right kind of quantity and behaves sensibly in simple boundary situations.","useful":"Formulas, estimates, models, and catching errors before detailed calculation.","watch":"Passing these checks does not prove correctness. Do not demand meaningful behavior outside a model's stated domain.","sources":"<a href=\"#s3\">S3<\/a>, section 5, \"Dimensional analysis\" and \"Limiting cases.\"","src":"s3"},{"n":20,"title":"Use symmetry to avoid repeated work","steps":["Find transformations that preserve all rules and the goal.","Group cases that those transformations make equivalent.","Solve one representative from each group.","Translate the result to the equivalent cases.","If counting, account for group sizes carefully; some configurations have more symmetry than others."],"desc":"If swapping, rotating, reflecting, or relabeling parts leaves the problem unchanged, work with one representative of each genuinely different case.","useful":"Geometry, counting, arrangements, and optimization with interchangeable elements.","watch":"A symmetric problem need not have only symmetric solutions. Distinguishing constraints can destroy an apparent symmetry.","sources":"<a href=\"#s3\">S3<\/a>, section 5, \"Symmetry reduction.\"","src":"s3"},{"n":21,"title":"Compare choices through outcomes and trade-offs","steps":["List feasible options, including doing nothing when relevant.","Draw the important possible outcomes for each option.","Record benefits, costs, foregone alternatives, and any probability estimates you can justify.","Compare outcomes using consistent criteria. Where numerical values and probabilities are meaningful, calculate probability-weighted totals.","Vary uncertain assumptions and check downside outcomes before deciding."],"desc":"Make alternatives explicit, including what each one gives up. Separate your choices from events you do not control.","useful":"Decisions with uncertainty, competing objectives, or several plausible options.","watch":"A favorable average can hide an unacceptable loss. Do not invent probabilities or hide value judgments inside a single score.","sources":"<a href=\"#s3\">S3<\/a>, sections 7.3 and 9.","src":"s3"},{"n":22,"title":"Map interactions and incentives","steps":["Draw the important components or participants as nodes.","Connect them with dependencies, flows, or influences and label the direction.","Look for bottlenecks, feedback loops, and competing goals.","Predict how a proposed change would affect the rest of the system and how other participants might respond.","Test a limited change and check the whole-system result, not just the improved part."],"desc":"Look beyond individual parts. A problem may be caused by dependencies, limited flow, feedback, or people responding to one another's incentives.","useful":"Organizational problems, process bottlenecks, coordination, and changes with side effects.","watch":"A network diagram is a model, not evidence that a causal link exists. Do not assume people have identical information or behave exactly as your model predicts.","sources":"<a href=\"#s3\">S3<\/a>, sections 8.1 and 8.4. The procedure is a practical adaptation of these perspectives.","src":"s3"},{"n":23,"title":"Experiment, find a pattern, then explain it","steps":["Produce several small examples and record them in a consistent table or diagram.","Look for repetitions, differences, ratios, or other stable relationships.","State the suspected rule precisely, including where you think it applies.","Test deliberately awkward cases rather than only examples likely to agree.","If the rule survives, explain or prove it from the problem's structure. If it fails, use the failure to refine the rule."],"desc":"Use examples to discover a possible rule, then look for the reason it should hold.","useful":"Sequences, repeated processes, counting, and exploring unfamiliar systems.","watch":"Many different rules can fit the same early examples. Evidence from examples and a general proof are different things.","sources":"<a href=\"#s4\">S4<\/a>, section 2.2, especially pp. 26-33, and section 6.1, p. 195; <a href=\"#s3\">S3<\/a>, sections 4 and 6.","src":"s4"},{"n":24,"title":"Test the opposite and search for a counterexample","steps":["Write the assumptions and the exact conclusion separately.","Negate the conclusion carefully. For example, the opposite of \"every case works\" is \"at least one case fails.\"","Explore that possibility while keeping the original assumptions.","If it forces a genuine contradiction, explain why the negated conclusion is impossible.","If you find a valid counterexample instead, reject or narrow the original claim."],"desc":"When a claim is hard to establish directly, ask what would happen if it were false. Alternatively, try to build a case that obeys the assumptions but breaks the conclusion.","useful":"Proofs, reviewing universal claims, and exposing faulty rules.","watch":"Failure to find a counterexample is not proof. In empirical problems, a conflict may show that the model or an assumption is wrong rather than establish a universal truth.","sources":"<a href=\"#s4\">S4<\/a>, section 2.3, pp. 41-44.","src":"s4"},{"n":25,"title":"Focus on an extreme element","steps":["Choose an ordering or a quantity to minimize or maximize.","Check that an extreme object actually exists.","Select it and write down what its extreme status rules out.","Ask whether a proposed configuration would force an even smaller or larger object, contradicting that choice.","Use the resulting restriction to solve or reduce the problem."],"desc":"Pick the smallest, largest, first, last, or most constrained object. Its extreme position gives you information unavailable for an arbitrary object.","useful":"Existence proofs, arrangements, ordered data, and reducing complicated cases.","watch":"An infinite collection need not have a minimum or maximum. This scheme selects an actual extreme object; it is different from testing a formula at a limiting value.","sources":"<a href=\"#s4\">S4<\/a>, section 3.2, pp. 73-83.","src":"s4"},{"n":26,"title":"Show that something must share a slot","steps":["Decide which objects you will place into categories.","Define the categories so that sharing one gives a useful relationship.","Assign every object to exactly one category, handling boundaries explicitly.","Compare object count with category count or capacity. More than <code>k × m<\/code> objects in <code>m<\/code> categories forces some category to contain at least <code>k + 1<\/code> objects.","Translate the shared category back into the result you need."],"desc":"If there are more objects than available categories, at least one category must contain multiple objects. This is the pigeonhole principle.","useful":"Proving unavoidable repetitions, collisions, close pairs, and capacity limits.","watch":"The hard part is choosing useful categories. The principle guarantees that a shared category exists, not necessarily which one it is.","sources":"<a href=\"#s4\">S4<\/a>, section 3.3, pp. 84-91.","src":"s4"},{"n":27,"title":"Find something that cannot change","steps":["Define the allowed moves precisely.","Test candidate invariants such as a total, difference, parity, remainder, or color balance.","Prove that each type of move preserves the chosen property.","Compare its value at the start and in the desired end state.","If they differ, the target is impossible under those moves. If they agree, continue searching using the invariant as a check."],"desc":"Look for a quantity or property preserved by every allowed move. This is an invariant.","useful":"Transformation puzzles, reachability, bookkeeping, and checking repeated operations.","watch":"Matching an invariant does not establish reachability. You must test every allowed move, not just the ones in your first examples.","sources":"<a href=\"#s4\">S4<\/a>, section 3.4, pp. 92-102; the coloring example in section 2.4, pp. 54-55.","src":"s4"},{"n":28,"title":"Track a quantity that moves only one way","steps":["Define a numerical measure of the current state.","Check how every allowed move changes it.","Establish its direction of change and any lower or upper bound.","To prove stopping, show that progress cannot continue forever, for example because a nonnegative integer decreases by at least one at each active step.","Identify the states where progress stops and check that they satisfy the desired conclusion."],"desc":"Find a measure that never increases or never decreases. This is a monovariant; it can reveal progress, rule out a target, or help prove that a process stops.","useful":"Repeated procedures, games, iterative improvement, and termination arguments.","watch":"A decreasing real number can keep decreasing forever. A bounded monotone score alone does not prove finite termination, and unchanged-score moves may still cycle.","sources":"<a href=\"#s4\">S4<\/a>, section 3.4, \"Monovariants,\" pp. 102-106.","src":"s4"},{"n":29,"title":"Build the large case from smaller cases","steps":["Define the result or claim for size <code>n<\/code> precisely.","Solve all required starting cases.","Explain how a larger case reduces to smaller cases, or how correct smaller cases establish the next one.","For counting, ensure that the construction covers every case without duplicates. For proof, justify the step for an arbitrary allowed size.","Combine the starting cases with the step; check that no size is skipped."],"desc":"Replace a global problem with a rule connecting one size to earlier sizes. Use recurrence to compute results or induction to prove a claim for all sizes.","useful":"Counting, sequences, recursive procedures, and proofs indexed by whole numbers.","watch":"Assuming the very case you are trying to prove is circular. An induction step without the needed starting cases establishes nothing on its own.","sources":"<a href=\"#s4\">S4<\/a>, section 2.3, pp. 45-50, and section 6.4, pp. 214-217.","src":"s4"},{"n":30,"title":"Solve or count the complement","steps":["Define the complete set of allowed possibilities.","State exactly which possibilities fail the desired condition.","Check that success and failure are disjoint and together cover the whole set.","Count the whole set and subtract the failures, or use <code>P(success) = 1 - P(failure)<\/code> with the correct probability model.","Check edge cases and whether any failures were counted more than once."],"desc":"When the desired cases are complicated, describe the unwanted cases and remove them from the whole.","useful":"Counting, probability, and requirements such as \"at least one\" or \"not all.\"","watch":"Dividing counts to obtain a probability requires equally likely outcomes. Overlapping failure categories cannot simply be added.","sources":"<a href=\"#s4\">S4<\/a>, section 6.3, pp. 207-208.","src":"s4"},{"n":31,"title":"Count the same thing in two ways","steps":["Define exactly what is being counted and whether order matters.","Count it by one grouping or viewpoint.","Count it independently by another viewpoint, or construct a reversible mapping to easier objects.","Verify that both routes include every valid object with the same multiplicity.","Equate the totals or use the easier count. Investigate any disagreement."],"desc":"Two different ways of counting the same objects must give the same total. A one-to-one mapping can also replace a difficult count with an easier one.","useful":"Counting identities, audits, consistency checks, and translating arrangements into simpler codes.","watch":"Redundant choices create overcounting. Once earlier choices determine a later one, it is no longer an independent choice.","sources":"<a href=\"#s4\">S4<\/a>, section 6.1, pp. 191-192, and section 6.2, especially pp. 199-200.","src":"s4"},{"n":32,"title":"Add a helpful object or intermediate quantity","steps":["Ask what relationship would make the final step easy.","Introduce an object or quantity designed to expose that relationship.","Define it precisely and verify that it exists in the allowed setting.","Use it to form smaller claims connecting the givens to the target.","Translate the conclusion back so the final answer does not depend on an unjustified construction."],"desc":"Introduce something not explicitly requested, such as a line, variable, subtotal, or intermediate goal, to connect the known facts with the desired result.","useful":"Geometry, awkward expressions, and problems where the givens seem disconnected from the goal.","watch":"A useful-looking construction may be impossible or smuggle in the desired conclusion. Adding clutter without a purpose rarely helps.","sources":"<a href=\"#s4\">S4<\/a>, section 8.4, pp. 282-284; <a href=\"#s3\">S3<\/a>, section 5, auxiliary variables and constructions.","src":"s4"},{"n":33,"title":"List cases systematically and eliminate impossibilities","steps":["Define the possible choices or states and a consistent way to write each one.","Split the search into cases that cover every possibility without duplication.","Apply the strongest or cheapest checks first and cross out cases that violate them.","For each remaining case, continue with the next undecided choice. Keep the reasons for exclusions.","Check every surviving answer against all conditions. If claiming there are no others, explain why the search was complete."],"desc":"Turn a manageable search into a table or branching list. Use each condition to remove cases instead of guessing repeatedly.","useful":"Logic puzzles, small configuration searches, ordering problems, and finding all solutions.","watch":"The list can grow too large. If you switch to a limited search, say that unexamined candidates remain; finding no answer in a partial search is not proof of impossibility.","sources":"<a href=\"#s5\">S5<\/a>, pp. 285-286, exhaustive route enumeration, and pp. 331-332, the different-color cars problem; <a href=\"#s3\">S3<\/a>, section 6, orderly listing and elimination.","src":"s5"},{"n":34,"title":"Find only the quantity the question asks for","steps":["Underline the exact quantity requested.","Ask whether your current plan is solving for extra information you do not need.","Combine known relations to isolate the requested quantity directly.","Look for cancellation, pairing, fixed totals, or enough information to rule out every other answer.","Verify that the requested quantity is fixed even if some individual values remain unknown."],"desc":"You may be able to determine a total, difference, ratio, or position without discovering every individual value.","useful":"Problems that appear underdetermined, long calculations, and questions about aggregate quantities.","watch":"A fixed total does not determine its separate parts. If several valid configurations produce different requested values, the information really is insufficient.","sources":"<a href=\"#s5\">S5<\/a>, pp. 322-323, summing angles without finding each angle, and p. 332, finding the first car without reconstructing the entire order; <a href=\"#s4\">S4<\/a>, section 3.4, the tournament example on p. 102.","src":"s5"},{"n":35,"title":"Use a greedy choice as a first pass","steps":["Define a local rule, such as choosing the nearest unvisited stop.","At each step, choose the best available option under that rule without breaking an immediate hard constraint.","Continue until you have a complete candidate or cannot proceed.","Check the complete result, including requirements such as returning to the starting point.","Compare with another starting choice, a local improvement, or a bound before accepting it."],"desc":"Build a candidate by repeatedly taking the most attractive next step according to a simple rule.","useful":"Quickly producing a first route, ordering, or allocation when a full search is too expensive.","watch":"The best next move can force an expensive later move or a dead end. Greedy construction needs a separate proof before you can call its answer optimal.","sources":"<a href=\"#s5\">S5<\/a>, pp. 285-286. In its four-city example, nearest-neighbor construction gives 635 km while exhaustive comparison finds a 625 km route.","src":"s5"},{"n":36,"title":"Check progress and change the plan deliberately","steps":["State what your current attempt is meant to establish.","At a useful checkpoint, ask, \"What have I learned? What remains unknown? Why should this next step help?\"","Separate a lack of knowledge from a poor strategy or a mistaken reading of the problem.","Continue if the attempt is productive; otherwise return to the relevant earlier stage, obtain missing knowledge, or choose a different scheme.","At the end, verify the answer and record the reusable insight, the failed assumption, and when this method would be useful again."],"desc":"Monitor your reasoning while you work, not only after obtaining an answer. Being busy is not the same as making progress.","useful":"Long investigations, repeated failed attempts, learning, and any problem without an obvious method.","watch":"Do not switch methods at every difficulty, but do not keep a plan merely because you have already spent time on it. These schemes cannot replace necessary subject knowledge.","sources":"<a href=\"#s5\">S5<\/a>, pp. 27-28, 48-50, and 220-226, on self-monitoring, cyclical problem solving, and the interaction of knowledge, strategies, control, and beliefs.","src":"s5"},{"n":37,"title":"Generalize to reveal the structure","steps":["Identify a fixed detail that may be hiding the structure.","Replace it with a parameter while stating the allowed values.","Compare several members of the new family, including the original case.","Seek a relationship or argument valid across the family and identify exceptional cases.","Justify that relationship, then substitute the original value to answer the original question."],"desc":"Replace a specific number or object with a variable and investigate a family of related problems. A more general statement can reveal a relationship hidden by the original details.","useful":"Unexplained numerical patterns, reusable formulas, and problems with arbitrary-looking constants.","watch":"A wider claim may be harder or false. If generalization creates more confusion, return to a simpler instance and preserve any partial insight.","sources":"<a href=\"#s4\">S4<\/a>, section 2.2, Example 2.2.2, p. 28, replacing a fixed constant with a parameter; <a href=\"#s3\">S3<\/a>, section 3, abstraction and generalization.","src":"s4"}],"combine":[{"label":"Plan a small workshop","html":"Define success and constraints <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, work backward from the event <span class=\"refwrap\">(<a href=\"#scheme-1\" class=\"ref\" data-ref=\"1\">1<\/a>)<\/span>, break preparation into tasks <span class=\"refwrap\">(<a href=\"#scheme-3\" class=\"ref\" data-ref=\"3\">3<\/a>)<\/span>, and estimate from comparable work <span class=\"refwrap\">(<a href=\"#scheme-7\" class=\"ref\" data-ref=\"7\">7<\/a>)<\/span>. Check whether the complete schedule fits, not just each task separately."},{"label":"Investigate a recurring software failure","html":"State the exact failure <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, reproduce it in a smaller case <span class=\"refwrap\">(<a href=\"#scheme-16\" class=\"ref\" data-ref=\"16\">16<\/a>)<\/span>, and run controlled tests <span class=\"refwrap\">(<a href=\"#scheme-4\" class=\"ref\" data-ref=\"4\">4<\/a>)<\/span>. Record each result and change the hypothesis when the evidence stops supporting it <span class=\"refwrap\">(<a href=\"#scheme-36\" class=\"ref\" data-ref=\"36\">36<\/a>)<\/span>."},{"label":"Check whether a transformation is possible","html":"Write the allowed moves <span class=\"refwrap\">(<a href=\"#scheme-17\" class=\"ref\" data-ref=\"17\">17<\/a>)<\/span>, experiment on small cases <span class=\"refwrap\">(<a href=\"#scheme-23\" class=\"ref\" data-ref=\"23\">23<\/a>)<\/span>, and look for a preserved quantity <span class=\"refwrap\">(<a href=\"#scheme-27\" class=\"ref\" data-ref=\"27\">27<\/a>)<\/span>. If the start and target differ on that quantity, explain why every legal move preserves it before declaring the target impossible."}],"note":["Goal and success test","Known facts and unknowns","Hard constraints and untested assumptions","Chosen scheme and why it fits","Next action and what it should teach me","Result and evidence","What still needs checking","Continue, revise, or stop","Reusable lesson"],"sources":[{"id":"s1","code":"S1","title":"Heuristics and estimation","fields":[{"label":"Document","html":"<a href=\"heuristics&amp;amp;estimation_in_problem_solving_2024_12_19.docx\" class=\"doc-link\">heuristics&amp;estimation_in_problem_solving_2024_12_19.docx<\/a>"},{"label":"Reviewed","html":"All body text, including the bibliography. Main contributions: working backward, analogy, decomposition, trial and error, iterative improvement, estimation, calibration, and warnings about biased judgments. The bibliography is part of the supplied document, not a set of independently verified sources."},{"label":"Selection","html":"Preserved actionable general methods. Treated availability, representativeness, and anchoring as things to check rather than advice to follow. Omitted broad claims about professional applications and research effectiveness because they do not add a reusable procedure."}]},{"id":"s2","code":"S2","title":"Problem relaxation","fields":[{"label":"Document","html":"<a href=\"problem_relaxation_2025_01_04.docx\" class=\"doc-link\">problem_relaxation_2025_01_04.docx<\/a>"},{"label":"Reviewed","html":"All body text, including the initial survey, the additional mathematical techniques, and both educational sections. Main contributions: constraint and continuous relaxation, bounds, penalties, iterative restrictions, staged commitment, feedback between planning levels, and simpler instances."},{"label":"Selection and corrections","html":"Kept general procedures rather than specialist solver recipes. Distinguished an easier teaching example from a formal relaxation. Did not repeat claims that every convex problem has a unique optimum or that naive rounding produces a valid answer. Excluded faulty examples: unfolding a cube does not turn a surface path into an edge-only path; the equations <code>5c + 3d = 100<\/code> and <code>c + d = 25<\/code> force <code>c = d = 12.5<\/code>, so they have no integer solution; the claimed semicircle rule for arbitrary shapes under a parabola is unsupported. The fence-post example also mixes fixed-perimeter reasoning with factor pairs. These examples should not be used as instructions."}]},{"id":"s3","code":"S3","title":"Mathematical thinking and problem solving","fields":[{"label":"Document","html":"<a href=\"problem‑solving_heuristics_2026_04_26.docx\" class=\"doc-link\">problem‑solving_heuristics_2026_04_26.docx<\/a>"},{"label":"Reviewed","html":"All ten sections. Main contributions: explicit framing, the understand-plan-execute-review cycle, representation, units, limiting cases, symmetry, structured decisions, and systems and incentive models. Its discussion of evolutionary search and escaping local optima reinforces scheme 5; analogy and decomposition reinforce schemes 2 and 3."},{"label":"Selection","html":"Turned the broad perspectives into clearly labeled human-scale procedures. Did not present named search algorithms as interchangeable or repeat the blanket claim that none can guarantee optimality. Omitted broad historical claims and chemical metaphors where they did not add a distinct, testable action."}]},{"id":"s4","code":"S4","title":"The art and craft of problem solving","fields":[{"label":"Document","html":"<a href=\"the-art-and-craft-of-problem-solving.pdf\" class=\"doc-link\">the-art-and-craft-of-problem-solving.pdf<\/a>"},{"label":"Author and edition","html":"Paul Zeitz, second edition. Page references above use printed page numbers, not PDF viewer positions."},{"label":"Reviewed for reusable methods","html":"Contents and reading guidance; the methodological discussions and selected worked examples in sections 2.2-2.4, 3.2-3.4, 6.1-6.4, and 8.4. Checked a rendered extreme-principle geometry page against the extracted text. Main additions: conjecture testing, contradiction, extreme elements, pigeonholes, invariants, monovariants, induction and recurrence, complements, double counting, and auxiliary constructions."},{"label":"Selection","html":"This is a method-focused review, not a solution or transcription of the book's exercise collection. Specialized algebra, number theory, calculus, and geometry tools are outside this guide unless they expose a broadly reusable scheme. The book also reinforces working backward, simplifying, changing representation, symmetry, and graph-based thinking already covered above."}]},{"id":"s5","code":"S5","title":"Heuristics for teaching and learning mathematics","fields":[{"label":"Document","html":"<a href=\"Heuristics in Problem Solving for the Teaching and Learning of Mathematics.pdf&amp;gt;\" class=\"doc-link\">Heuristics in Problem Solving for the Teaching and Learning of Mathematics.pdf&gt;<\/a>"},{"label":"Author and date","html":"Nuno Álvaro Ferreira Rodrigues, doctoral thesis, University of Coimbra, 2015. Page references above use printed page numbers."},{"label":"Reviewed for reusable methods","html":"Abstract, contents, selected metacognition and problem-solving discussions on pp. 27-28 and 48-50, the conclusion around pp. 212-213, and the annex's outline and methodological guidance on pp. 215-226. Examined selected worked examples on pp. 236-237, 252-253, 285-286, 320-333, and the final visual paradox discussion on pp. 402-405. Visually checked the cyclical-process diagram on p. 223 and the route-method comparison on p. 285."},{"label":"Main contributions","html":"Systematic enumeration and elimination, solving only for the requested quantity, greedy construction with a clear counterexample to optimality, and monitoring and revising the solving process. Earlier schemes are reinforced through concrete examples of representation, relaxation, auxiliary constructions, symmetry, and extreme choices."},{"label":"Selection","html":"Treated the annex as a source of worked reasoning patterns, not as a reason to copy every mathematical exercise or historical anecdote. The thesis reports limitations in its short classroom intervention, so this guide does not claim that learning a list of heuristics alone guarantees improved performance. Practice, subject knowledge, and reviewing one's reasoning remain necessary."}]}],"title":"Practical problem solving heuristics","howH":"How to use this guide","chooserH":"Quick chooser","schemesH":"Schemes","combineH":"Combining schemes in practice","combineIntro":"These examples illustrate use of the guide; they are not additional source case studies.","noteH":"A reusable working note","noteIntro":"Copy these prompts when starting a problem:","sourcesH":"Source review in reading order","sourcesIntro":"All five non-HTML subject documents in the folder are represented below. The three Word documents were read in full as text. The two long PDFs received method-focused reviews of the sections and examples specified below. Their exercise collections and literature reviews were not exhaustively worked through. Source texts were left unchanged.","labels":{"desc":"Description","useful":"Useful for","steps":"Procedure","watch":"Watch out","sources":"Sources"}},"pl":{"lang":"pl","intro":["Heurystyka to użyteczny sposób poszukiwania rozwiązania, a nie gwarancja, że będzie ono poprawne lub najlepsze. Ten przewodnik zbiera schematy wielokrotnego użytku z dokumentów znajdujących się w tym folderze, z pominięciem plików HTML. Przy każdym schemacie znajdziesz wyjaśnienie, kiedy go użyć i co zrobić dalej.","Procedury są opracowaniami napisanymi prostym językiem, nie cytatami. Przykłady spoza matematyki pokazują, jak można przenieść dany schemat na inny obszar; nie oznacza to, że źródła potwierdzają jego skuteczność w tych zastosowaniach. Podobne pomysły połączono, zamiast je powtarzać. Krótkie oznaczenia źródeł odsyłają do przeglądu dokumentów na końcu."],"how":["Zapisz, co chcesz osiągnąć, co już wiesz i jakie warunki musi spełniać poprawna odpowiedź. Wybierz schemat pasujący do napotkanej trudności. Notuj swoje próby i to, czego się z nich dowiadujesz. Zanim przyjmiesz wynik, sprawdź go względem pierwotnego problemu.","Traktuj schematy jako zestaw do wyboru, nie listę do wykonania po kolei. Czasem trzeba wrócić do sformułowania problemu, zmienić metodę albo połączyć dwa podejścia. Heurystyka pomaga odkryć odpowiedź; dowód, odpowiedni test lub sprawdzenie wykonalności pozwalają ustalić, co można o niej powiedzieć z pewnością."],"chooser":[{"obstacle":"Pytanie jest niejasne lub wydaje się, że brakuje danych","starts":[{"n":17,"label":"Doprecyzuj problem"},{"n":34,"label":"Ustal tylko to, o co pytają"}]},{"obstacle":"Rozumiesz cel, ale nie widzisz drogi do niego","starts":[{"n":1,"label":"Rozumuj od końca"},{"n":2,"label":"Wykorzystaj analogię"},{"n":32,"label":"Dodaj element pomocniczy"},{"n":4,"label":"Stosuj kontrolowane próby i błędy"}]},{"obstacle":"Problem jest zbyt duży lub zagmatwany","starts":[{"n":3,"label":"Podziel na części"},{"n":16,"label":"Wypróbuj mały przypadek"},{"n":18,"label":"Zmień sposób przedstawienia"}]},{"obstacle":"Ograniczenia sprawiają, że każda próba zawodzi","starts":[{"n":9,"label":"Złagodź ograniczenie"},{"n":10,"label":"Dopuść ułamki"},{"n":13,"label":"Dodawaj uzasadnione ograniczenia"}]},{"obstacle":"Potrzebujesz przybliżonego wyniku lub sprawdzenia jego realności","starts":[{"n":6,"label":"Oszacuj skalę"},{"n":7,"label":"Wykorzystaj podobne przypadki"},{"n":19,"label":"Sprawdź jednostki i granice"}]},{"obstacle":"Wiele rozwiązań działa, ale szukasz lepszego","starts":[{"n":5,"label":"Ulepszaj i próbuj od nowa"},{"n":11,"label":"Wyznacz oszacowania"},{"n":35,"label":"Zacznij od metody zachłannej"}]},{"obstacle":"Plan ma etapy lub kilka poziomów decyzji","starts":[{"n":14,"label":"Podejmuj decyzje etapami"},{"n":15,"label":"Sprawdzaj szczegóły względem ogólnego planu"}]},{"obstacle":"Wybory wiążą się z niepewnością lub sprzecznymi interesami","starts":[{"n":8,"label":"Sprawdź błędy poznawcze"},{"n":12,"label":"Wyceń kompromisy"},{"n":21,"label":"Porównaj skutki"},{"n":22,"label":"Rozrysuj zależności"}]},{"obstacle":"Chcesz zbadać wzorzec lub ogólną regułę","starts":[{"n":23,"label":"Eksperymentuj i wyjaśniaj"},{"n":29,"label":"Użyj rekurencji lub indukcji"},{"n":37,"label":"Uogólnij"}]},{"obstacle":"Podejrzewasz, że twierdzenie jest fałszywe lub cel nieosiągalny","starts":[{"n":24,"label":"Sprawdź zaprzeczenie"},{"n":25,"label":"Wybierz element skrajny"},{"n":27,"label":"Znajdź niezmiennik"}]},{"obstacle":"Problem dotyczy zliczania lub układania obiektów","starts":[{"n":20,"label":"Symetria"},{"n":26,"label":"Zasada szufladkowa"},{"n":30,"label":"Dopełnienie"},{"n":31,"label":"Policz na dwa sposoby"},{"n":33,"label":"Uporządkuj przypadki"}]},{"obstacle":"Proces się powtarza lub twoja praca utknęła","starts":[{"n":28,"label":"Śledź zmianę w jednym kierunku"},{"n":36,"label":"Oceń postęp i popraw plan"}]}],"schemes":[{"n":1,"title":"Rozumuj od końca, zaczynając od celu","steps":["Opisz dokładnie końcowy wynik.","Zapytaj: „Co wystarczyłoby, żeby go uzyskać?”.","Powtarzaj to pytanie dla każdego nowego wymagania, aż dojdziesz do czegoś już znanego lub możliwego do wykonania.","Odwróć kolejność i wykonaj kroki od rzeczywistego punktu wyjścia.","Sprawdź każdy krok w kierunku celu. Warunek konieczny do sukcesu nie musi wystarczać do jego osiągnięcia."],"desc":"Zacznij od pożądanego wyniku i zapytaj, co musiałoby być prawdą bezpośrednio przed jego uzyskaniem. Zamień odległy cel w ciąg wymagań.","useful":"Przy planowaniu, szukaniu brakujących warunków wstępnych, rozwiązywaniu równań i budowaniu dowodów.","watch":"Rozumowanie wstecz może wskazać drogę, ale samo nie dowodzi, że ta droga działa.","sources":"<a href=\"#s1\">S1<\/a>; <a href=\"#s4\">S4<\/a>, podrozdział 2.2, strategia przedostatniego kroku, s. 27.","src":"s1"},{"n":2,"title":"Wykorzystaj strukturę rozwiązanego problemu","steps":["Wypisz główne obiekty, zależności, ograniczenia i cel obecnego problemu.","Znajdź rozwiązany problem o podobnej strukturze.","Każdej ważnej części tamtego problemu przyporządkuj część obecnego.","Dostosuj zastosowaną wcześniej metodę rozwiązania.","Wskaż różnice, które mogłyby podważyć analogię, i sprawdź je w pierwszej kolejności."],"desc":"Znajdź wcześniejszy problem oparty na tych samych zależnościach, nawet jeśli dotyczy czegoś innego. Przenieś metodę, a nie samą odpowiedź.","useful":"Przy nieznanych problemach, projektowaniu, diagnozowaniu usterek i nauce nowego zagadnienia.","watch":"Zewnętrzne podobieństwo to słaby argument. Zależności, dzięki którym wcześniejsze rozwiązanie działało, muszą zachodzić również tutaj.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":3,"title":"Podziel problem na części","steps":["Podziel problem na części o jasno określonych wynikach.","Zaznacz, które części zależą od innych.","Najpierw rozwiąż niezależną część lub spełnij ważny warunek wstępny.","Połącz wyniki częściowe, uwzględniając pracę potrzebną do ich połączenia.","Sprawdź całość względem pierwotnego celu i ograniczeń."],"desc":"Zastąp jedno duże zadanie mniejszymi, których wyniki można połączyć.","useful":"W projektach, złożonych obliczeniach, projektowaniu systemów i wieloetapowych analizach.","watch":"Części mogą na siebie wpływać. Kilka dobrych rozwiązań lokalnych nie musi tworzyć dobrego rozwiązania całości.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":4,"title":"Stosuj kontrolowane próby i błędy","steps":["Określ jednoznaczny test sukcesu.","Wybierz wiarygodnego kandydata na rozwiązanie i przewidź, co powinno się wydarzyć.","Przetestuj go przy ograniczonym koszcie i ryzyku.","Zapisz, co zadziałało, co zawiodło i jakie możliwości wyklucza niepowodzenie.","Jeśli to możliwe, zmień jedną istotną cechę i przetestuj ponownie. Nie powtarzaj prób, z których niczego się nie dowiadujesz."],"desc":"Wypróbuj możliwe rozwiązanie, wyciągnij wnioski z wyniku i świadomie wybierz następną próbę.","useful":"Przy diagnozowaniu usterek, tworzeniu prototypów i niewielkich poszukiwaniach, gdy testy są tanie i bezpieczne.","watch":"Bez zapisu zmian trudno ustalić, co spowodowało poprawę. Nie eksperymentuj bez zabezpieczeń, jeśli skutki mogą być nieodwracalne lub niebezpieczne.","sources":"<a href=\"#s1\">S1<\/a>.","src":"s1"},{"n":5,"title":"Ulepszaj działające rozwiązanie i wychodź ze ślepych zaułków","steps":["Ustal, co sprawia, że jedno poprawne rozwiązanie jest lepsze od innego.","Przygotuj rozwiązanie początkowe spełniające wymagania.","Wypróbuj niewielkie zmiany i zachowuj korzystne ulepszenia.","Gdy postęp ustanie, zachowaj kopię najlepszego rozwiązania i spróbuj zacząć od nowa lub wprowadzić większą zmianę.","Porównuj najlepszych kandydatów według tych samych kryteriów. Zakończ po osiągnięciu ustalonego poziomu jakości lub limitu czasu."],"desc":"Zacznij od akceptowalnego rozwiązania i ulepszaj je małymi zmianami. Gdy przestają pomagać, wypróbuj inny punkt wyjścia lub większą zmianę.","useful":"Przy harmonogramach, układach przestrzennych, trasach, podziale zasobów i projektach z wieloma możliwymi rozwiązaniami.","watch":"Rozwiązanie lepsze od wszystkich bliskich wariantów nie musi być najlepsze w całym zbiorze możliwości. Podczas poszukiwań zachowuj bezwzględne ograniczenia.","sources":"<a href=\"#s1\">S1<\/a>, „Improvement heuristics” i „Meta-heuristic methods”; <a href=\"#s3\">S3<\/a>, części 7.2 i 8.2. To adaptacja do samodzielnej pracy, nie pełna specyfikacja tych algorytmów.","src":"s1"},{"n":6,"title":"Oszacuj skalę, zanim zaczniesz dokładnie liczyć","steps":["Nazwij szukaną wielkość i jej jednostkę.","Rozłóż ją na wielkości łatwiejsze do oszacowania.","Wybierz zaokrąglone wartości i zapisz stojące za nimi założenia.","Połącz wartości, sprawdzając zgodność jednostek.","Dla niepewnych danych wejściowych wypróbuj wiarygodne wartości niskie i wysokie. Podaj przybliżony zakres zamiast pozornej precyzji."],"desc":"Użyj zaokrąglonych wielkości i prostych zależności, aby ustalić przybliżoną wartość wyniku.","useful":"We wstępnym planowaniu, szybkiej ocenie wykonalności i wykrywaniu niewiarygodnych wyników obliczeń.","watch":"Oszacowanie nie jest dokładnym wynikiem, gwarancją ani zobowiązaniem do stałej ceny. Gdy wymaga tego decyzja, użyj bardziej rygorystycznej metody.","sources":"<a href=\"#s1\">S1<\/a>, „What is Estimation?” i „Improving Estimation Accuracy”.","src":"s1"},{"n":7,"title":"Szacuj na podstawie części i podobnych przypadków","steps":["Podziel pracę na części, które się nie pokrywają.","Oszacuj każdą część na podstawie podobnej ukończonej pracy lub odpowiedniego wskaźnika, na przykład czasu na jednostkę.","Uwzględnij koordynację, integrację i inne zadania, które nie należą do pojedynczej części.","Porównaj sumę z wynikiem podobnego zadania rozpatrywanego jako całość. Wyjaśnij duże różnice.","Po zakończeniu porównaj oszacowanie z rzeczywistym wynikiem i popraw założenia na przyszłość."],"desc":"Zbuduj oszacowanie z mniejszych elementów, a następnie porównaj je z rzeczywistymi przykładami lub tempem pracy zmierzonym przy podobnych zadaniach.","useful":"Przy szacowaniu nakładu pracy, wydajności, ilości i kosztów, gdy dostępne są odpowiednie dane z przeszłości.","watch":"Nakład pracy i czas od rozpoczęcia do zakończenia to różne wielkości. Praca równoległa, zależności i wspólne ryzyka wpływają na wynik całości; nietypowa praca może nie pasować do historycznych wskaźników.","sources":"<a href=\"#s1\">S1<\/a>, „Improving Estimation Accuracy” i „Business”.","src":"s1"},{"n":8,"title":"Sprawdź, czy skrót myślowy cię nie zwodzi","steps":["Zapisz pierwszą odpowiedź i powód, dla którego wydaje się wiarygodna.","Zapytaj, czy wynika głównie z niedawnego lub zapadającego w pamięć przykładu, podobieństwa albo początkowej liczby.","Poszukaj odpowiednich danych i porównywalnych przypadków, w tym dowodów przeciwko pierwszej odpowiedzi.","Opracuj drugie oszacowanie lub wyjaśnienie inną drogą, zamiast tylko korygować pierwsze.","Porównaj wyniki i określ, co pozostaje niepewne."],"desc":"Potraktuj pierwszą ocenę jako hipotezę wstępną. Sprawdź, czy nie opiera się głównie na wyrazistych wspomnieniach, stereotypach lub pierwszej napotkanej liczbie.","useful":"Przy niepewnych ocenach, interpretowaniu dowodów i sprawdzaniu oszacowań.","watch":"Dostępność, reprezentatywność i zakotwiczenie opisują możliwe skróty w ocenianiu, a nie niezawodne procedury ustalania prawdy.","sources":"<a href=\"#s1\">S1<\/a>, „Examples of Common Heuristics” i „Limitations”.","src":"s1"},{"n":9,"title":"Tymczasowo usuń trudne ograniczenie","steps":["Wypisz pierwotne ograniczenia, oddzielając rzeczywiste wymagania od założeń lub zwyczajów.","Wybierz jedno trudne ograniczenie i jawnie usuń je lub złagodź w roboczym modelu.","Rozwiąż tę wersję, nie zmieniając pierwotnego celu.","Sprawdź, które pierwotne ograniczenia narusza wynik.","Przywracaj je pojedynczo, dostosowując rozwiązanie lub wykorzystując wynik wyłącznie jako oszacowanie graniczne bądź wskazówkę."],"desc":"Rozwiąż wersję z mniejszą liczbą ograniczeń, aby odkryć, co jest możliwe i które warunki powodują trudność. To relaksacja ograniczeń.","useful":"Przy planach obciążonych zbyt wieloma ograniczeniami, podziale zasobów, harmonogramowaniu i optymalizacji.","watch":"Rozwiązanie problemu po relaksacji może być niemożliwe w rzeczywistym zadaniu. Wymagania bezpieczeństwa łagodź wyłącznie w modelu; nigdy nie pomijaj ich bez wyjaśnienia w końcowym rozwiązaniu.","sources":"<a href=\"#s2\">S2<\/a>, „Constraint Relaxation”.","src":"s2"},{"n":10,"title":"Najpierw dopuść ułamki, potem wróć do całych jednostek","steps":["Wskaż decyzje wymagające liczb całkowitych lub wyboru tak/nie.","Dopuść ułamki w tych samych granicach, zachowując pozostałe ograniczenia i cel.","Rozwiąż problem po relaksacji.","Potraktuj wynik jako wskazówkę przy szukaniu dopuszczalnych wyborów całkowitoliczbowych.","Ponownie sprawdź każde pierwotne ograniczenie i porównaj końcową wartość z oszacowaniem uzyskanym z relaksacji."],"desc":"Tymczasowo pozwól, by niepodzielne wybory przyjmowały wartości ułamkowe. Łatwiejszy problem może wskazać użyteczny cel lub oszacowanie graniczne. To relaksacja ciągła.","useful":"Przy wyborze przedmiotów, przydzielaniu zasobów i planowaniu ilości, które ostatecznie muszą być całkowite.","watch":"Zaokrąglenie może naruszyć budżet, pojemność lub wymaganą dokładną sumę. Bliskie rozwiązanie całkowitoliczbowe może nie istnieć, a najlepsze poprawne rozwiązanie może leżeć daleko.","sources":"<a href=\"#s2\">S2<\/a>, „Continuous Relaxation” i „Linear (LP) Relaxation”.","src":"s2"},{"n":11,"title":"Wyznacz oszacowania, aby ocenić możliwą poprawę","steps":["Określ, czy coś minimalizujesz, na przykład odległość, czy maksymalizujesz, na przykład wielkość produkcji.","Uzyskaj udowodnione oszacowanie graniczne, na przykład znajdując optimum poprawnie zrelaksowanego problemu.","Znajdź rozwiązanie spełniające wszys
